<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="柏原市対策">
<meta name="theme-color" content="#0f1115">
<meta name="color-scheme" content="dark light">
<title>SCOAトレーナー｜柏原市役所 技術職</title>
<style>
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  :root{
    --bg:#0f1115; --bg2:#161a21; --card:#1c212b; --card-hover:#232a36;
    --line:#2b3140; --ink:#c3c9d4; --ink-strong:#eef1f6; --ink-soft:#9aa5b8;
    --accent:#8ab4ff; --accent-ink:#0b1220;
    --ok:#33d17a; --ok-bg:#123a26; --ng:#ff6b6a; --ng-bg:#3a1414;
    --radius:14px; --fs-base:16px;
    --font-disp:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Consolas,monospace;
  }
  :root[data-theme="light"]{
    --bg:#f3f4ef; --bg2:#ffffff; --card:#ffffff; --card-hover:#f5f6f1;
    --line:#d7dbd0; --ink:#16211f; --ink-strong:#16211f; --ink-soft:#4a5854;
    --accent:#2f5fb0; --accent-ink:#ffffff;
    --ok:#1f7a45; --ok-bg:#e3f3e8; --ng:#b3341f; --ng-bg:#f7e4e0;
  }
  @media (prefers-color-scheme: light){
    :root[data-theme="system"]{
      --bg:#f3f4ef; --bg2:#ffffff; --card:#ffffff; --card-hover:#f5f6f1;
      --line:#d7dbd0; --ink:#16211f; --ink-strong:#16211f; --ink-soft:#4a5854;
      --accent:#2f5fb0; --accent-ink:#ffffff;
      --ok:#1f7a45; --ok-bg:#e3f3e8; --ng:#b3341f; --ng-bg:#f7e4e0;
    }
  }
  :root[data-fontsize="s"]{ --fs-base:15px; }
  :root[data-fontsize="m"]{ --fs-base:16px; }
  :root[data-fontsize="l"]{ --fs-base:18px; }

  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
  html{font-size:var(--fs-base)}
  body{
    font-family:var(--font-disp);
    line-height:1.7;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
  }
  [hidden]{display:none!important}
  button{font-family:inherit;color:inherit}
  h1,h2,h3,p{margin:0}
  textarea,input[type="text"]{font-size:16px}

  .view{
    min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column;
  }

  /* ===== 汎用ボタン ===== */
  .btn{
    touch-action:manipulation; user-select:none; cursor:pointer;
    background:var(--card); color:var(--ink); border:1px solid var(--line);
    border-radius:var(--radius); padding:12px 16px; font-size:0.95rem; font-weight:600;
    min-height:48px; text-align:center;
  }
  .btn:hover{background:var(--card-hover)}
  .btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .btn:disabled{opacity:.4; cursor:default}
  .btn-primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
  .btn-primary:hover{filter:brightness(1.05)}
  .btn-lg{
    display:flex; flex-direction:column; align-items:flex-start; gap:3px;
    min-height:64px; padding:12px 18px; width:100%; text-align:left;
  }
  .btn-hero{min-height:72px}
  .btn-outline{background:transparent}
  .btn-sm{min-height:44px; padding:8px 14px; font-size:0.85rem; width:auto}
  .btn-danger{color:var(--ng); border-color:var(--ng)}
  .menu-title{font-size:1rem; font-weight:700}
  .menu-sub{font-size:0.8rem; color:var(--ink-soft); font-weight:500}
  .btn-primary .menu-sub{color:var(--accent-ink); opacity:.8}

  @media (prefers-reduced-motion:no-preference){
    .btn{transition:background .12s ease, filter .12s ease}
  }

  /* ===== ホーム ===== */
  .home-wrap{max-width:520px;width:100%;margin:0 auto;padding:20px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;flex:1}
  .topbar{padding:6px 2px 4px}
  .brand{font-size:1.15rem;font-weight:800;letter-spacing:.02em;color:var(--ink-strong)}
  .brand-sub{font-size:.78rem;color:var(--ink-soft);margin-top:2px}
  .menu{display:flex;flex-direction:column;gap:9px}
  .menu-secondary{flex-direction:row}
  .menu-secondary .btn{flex:1}
  .guide{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px;font-size:.9rem}
  .today-strip{margin-top:auto;padding-top:8px;font-size:.8rem;color:var(--ink-soft);text-align:center}
  .no-bank{font-size:.85rem;color:var(--ng);background:var(--ng-bg);border-radius:var(--radius);padding:12px;text-align:center}

  /* ===== 控えめな案内バナー（バックアップ促し／ホーム追加案内） ===== */
  .reminder-banner{
    background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:var(--radius);padding:12px 14px;font-size:.82rem;color:var(--ink-soft);line-height:1.6;
  }
  .reminder-banner p{margin-bottom:8px}
  .reminder-actions{display:flex;gap:8px}
  .addhome-card{
    position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 46px 12px 14px;font-size:.8rem;color:var(--ink-soft);line-height:1.6;
  }
  .addhome-card .iconbtn{position:absolute;top:2px;right:2px}

  /* ===== サブ画面共通ヘッダー ===== */
  .subbar{display:flex;align-items:center;gap:8px;padding:10px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
  .subbar-title{font-size:1rem;font-weight:700;color:var(--ink-strong)}
  .iconbtn{
    touch-action:manipulation;user-select:none;cursor:pointer;background:transparent;border:none;color:var(--ink);
    font-size:1.4rem;line-height:1;min-width:44px;min-height:44px;border-radius:10px;
  }
  .iconbtn:hover{background:var(--card-hover)}
  .iconbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ===== 分野別 ===== */
  .fields-wrap{max-width:560px;width:100%;margin:0 auto;padding:12px 14px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
  .field-row{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
    min-height:56px;touch-action:manipulation;user-select:none;cursor:pointer;width:100%;text-align:left;
  }
  .field-row:hover{background:var(--card-hover)}
  .field-name{font-weight:700;font-size:.95rem}
  .field-meta{font-size:.78rem;color:var(--ink-soft)}
  .field-row.is-weak{border-color:var(--ng)}
  .field-row.is-weak .field-meta{color:var(--ng)}
  .field-row.is-untouched .field-meta{color:var(--ink-soft);opacity:.7}

  /* ===== 出題画面 =====
     HUD（固定）／問題領域（可変・内部スクロール）／選択肢（固定・常に画面内）の3段構成。
     #view-quiz の高さをビューポートちょうどに固定し、はみ出す分は問題領域だけが
     内部スクロールする。選択肢欄はページの一部として自然な高さで常に表示される。 */
  #view-quiz{
    height:100vh; height:100dvh;
    overflow:hidden;
  }
  .quiz-hud{flex:0 0 auto;padding:10px 16px 4px;max-width:560px;width:100%;margin:0 auto}
  .quiz-scroll-wrap{position:relative;flex:1 1 auto;min-height:0;max-width:560px;width:100%;margin:0 auto;display:flex}
  .quiz-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 10px}
  .scroll-hint{
    position:absolute;left:0;right:0;bottom:0;height:26px;
    background:linear-gradient(to bottom, transparent, var(--bg) 85%);
    pointer-events:none;opacity:0;
  }
  .scroll-hint.show{opacity:1}
  @media (prefers-reduced-motion:no-preference){ .scroll-hint{transition:opacity .15s ease} }
  .quiz-bottom{
    /* HUD＋選択肢欄だけで100dvhを超えるケース（長い選択肢×4＋長い解説）に備え、
       ここに緩い上限を持たせる。ただし中身を丸ごとスクロール領域にはしない
       （回答後のfocus()移動で選択肢自体が隠れてしまうため）。
       縮んでよいのは解説文（.fb-exp）だけとし、選択肢・★・正誤・次へは
       常にflex-shrink:0で確保する。 */
    flex:0 0 auto;display:flex;flex-direction:column;gap:8px;min-height:0;
    padding:8px 16px calc(14px + env(safe-area-inset-bottom));
    max-width:560px;width:100%;margin:0 auto;
    max-height:82vh; max-height:82dvh;
    overflow:hidden;
  }
  .hud{display:flex;align-items:center;gap:10px}
  .hud-mid{flex:1;min-width:0}
  .hud-cat{font-size:.78rem;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hud-pos{font-size:.85rem;font-weight:700}
  .hud-clock{font-family:var(--font-mono);font-size:1.05rem;font-weight:700;min-width:64px;text-align:right}
  .hud-clock.over{color:var(--ng)}
  .hud-overall{font-family:var(--font-mono);font-size:.78rem;color:var(--ink-soft);text-align:right;padding:0 2px 4px}
  .timerbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:2px 0}
  .timerbar i{display:block;height:100%;width:0%;background:var(--accent)}
  .timerbar.over i{background:var(--ng)}
  @media (prefers-reduced-motion:no-preference){ .timerbar i{transition:width .15s linear} }
  .overmsg{font-size:.78rem;color:var(--ng);margin:2px 0 0}

  .qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px;margin-top:10px}
  .qtext{font-size:1.05rem;font-weight:700;line-height:1.65}
  .qsub{margin-top:12px;font-family:var(--font-mono);font-size:.92rem;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;white-space:pre-wrap;overflow-x:auto}
  .qtbl{margin-top:12px}
  .tblscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px}
  .qtbl table{border-collapse:collapse;width:100%;min-width:280px}
  .qtbl th,.qtbl td{border-bottom:1px solid var(--line);padding:7px 10px;font-size:.85rem;text-align:center;white-space:nowrap}
  .qtbl th{background:var(--bg2);font-weight:700}
  .qtbl tr:last-child td{border-bottom:none}

  .opts{display:flex;flex-direction:column;gap:8px;flex:0 0 auto}
  .opt-btn{
    display:flex;align-items:flex-start;gap:10px;width:100%;min-height:56px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
    touch-action:manipulation;user-select:none;cursor:pointer;text-align:left;
  }
  .opt-btn:hover:not(:disabled){background:var(--card-hover)}
  .opt-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .opt-btn:disabled{cursor:default}
  .opt-mk{font-family:var(--font-mono);font-weight:800;color:var(--ink-soft);flex:none;padding-top:1px}
  .opt-tx{font-size:.95rem;line-height:1.55;white-space:normal;overflow-wrap:anywhere}
  .opt-btn.correct{border-color:var(--ok);background:var(--ok-bg)}
  .opt-btn.correct .opt-mk{color:var(--ok)}
  .opt-btn.wrong{border-color:var(--ng);background:var(--ng-bg)}
  .opt-btn.wrong .opt-mk{color:var(--ng)}

  .flagbtn{
    align-self:flex-start;background:transparent;border:1px solid var(--line);border-radius:20px;
    padding:8px 14px;font-size:.82rem;color:var(--ink-soft);touch-action:manipulation;user-select:none;cursor:pointer;min-height:44px;
    flex:0 0 auto;
  }
  .flagbtn.active{border-color:var(--accent);color:var(--accent)}

  /* #feedback は正誤(.fb-verdict、常に全表示)と解説(.fb-exp、収まらなければ内部スクロール)
     を縦に積む、それ自体が縮んでよい箱。次へボタンはこの外側にあるため常に全表示を維持する。 */
  .feedback{
    border-radius:var(--radius);padding:14px 16px;font-size:.9rem;line-height:1.7;
    display:flex;flex-direction:column;gap:0;flex:0 1 auto;min-height:0;
  }
  .feedback.ok{background:var(--ok-bg)}
  .feedback.ng{background:var(--ng-bg)}
  .fb-verdict{font-weight:800;font-size:.92rem;margin-bottom:6px;flex:0 0 auto}
  .feedback.ok .fb-verdict{color:var(--ok)}
  .feedback.ng .fb-verdict{color:var(--ng)}
  .fb-exp{flex:0 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .fb-e{color:var(--ink);margin-top:4px}
  .fb-t{color:var(--ink-soft);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}

  .btn-next{width:100%;min-height:56px;font-size:1rem;flex:0 0 auto}

  /* ===== 結果 ===== */
  .result-wrap{max-width:520px;width:100%;margin:0 auto;padding:24px 18px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px;flex:1}
  .result-title{font-size:1rem;font-weight:700;color:var(--ink-soft)}
  .result-score{font-family:var(--font-mono);font-size:2.1rem;font-weight:800;color:var(--ink-strong)}
  .result-meta{font-size:.88rem;color:var(--ink-soft)}
  .result-breakdown{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
  .bd-row{font-size:.88rem;display:flex;justify-content:space-between}
  .result-actions{display:flex;flex-direction:column;gap:8px;margin-top:auto}

  /* ===== 学習記録 ===== */
  .stats-wrap{max-width:560px;width:100%;margin:0 auto;padding:14px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
  .stats-wrap h3{font-size:.85rem;color:var(--ink-soft);margin-top:18px;margin-bottom:2px}
  .kpi-row{display:flex;gap:8px}
  .kpi{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .kpi-label{font-size:.72rem;color:var(--ink-soft)}
  .kpi-val{font-family:var(--font-mono);font-size:1.2rem;font-weight:800;margin-top:2px;color:var(--ink-strong)}
  .daybars{display:flex;align-items:flex-end;gap:4px;height:110px;padding-top:6px}
  .daybar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
  .daybar-n{font-size:.65rem;color:var(--ink-soft);margin-bottom:2px}
  .daybar-fill{width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
  .daybar-lab{font-size:.58rem;color:var(--ink-soft);margin-top:3px;writing-mode:horizontal-tb;white-space:nowrap}
  .sub-row{display:flex;justify-content:space-between;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:.88rem}
  .sub-row.is-weak{color:var(--ng)}
  .sub-row.is-untouched{color:var(--ink-soft);opacity:.6}
  #avgTrend{font-size:.88rem;color:var(--ink-soft)}
  .data-actions{display:flex;flex-direction:column;gap:8px}
  .dataarea{width:100%;min-height:140px;background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font-family:var(--font-mono);resize:vertical}
  #exportBtns{display:flex;gap:8px}
  #importBox{display:flex;flex-direction:column;gap:8px}

  /* ===== 設定 ===== */
  .settings-wrap{max-width:520px;width:100%;margin:0 auto;padding:14px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
  .setting-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .setting-label{font-size:.92rem;font-weight:600}
  .segmented{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .segmented button{
    touch-action:manipulation;user-select:none;cursor:pointer;background:var(--card);color:var(--ink-soft);
    border:1px solid var(--line);border-radius:20px;padding:8px 12px;font-size:.82rem;min-height:44px;
  }
  .segmented button.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
  .switch{position:relative;display:inline-block;width:46px;height:28px;flex:none}
  .switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
  .switch span{position:absolute;inset:0;background:var(--line);border-radius:28px;pointer-events:none}
  .switch span::before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:var(--bg2);border-radius:50%}
  .switch input:checked + span{background:var(--accent)}
  .switch input:checked + span::before{transform:translateX(18px);background:var(--accent-ink)}
  @media (prefers-reduced-motion:no-preference){ .switch span::before{transition:transform .15s ease} }
</style>
</head>
<body>

<section id="view-home" class="view">
  <div class="home-wrap">
    <header class="topbar">
      <div class="brand">SCOA トレーナー</div>
      <div class="brand-sub">柏原市役所 技術職（土木） 基礎能力検査対策</div>
    </header>

    <div id="noBankNotice" class="no-bank" hidden>問題データが読み込まれていません。</div>

    <div id="exportReminder" class="reminder-banner" hidden>
      <p id="exportReminderText"></p>
      <div class="reminder-actions">
        <button id="btnExportReminderGo" class="btn btn-sm">書き出す</button>
        <button id="btnExportReminderLater" class="btn btn-sm btn-outline">あとで</button>
      </div>
    </div>

    <div id="addToHomeCard" class="addhome-card" hidden>
      <p>Safariの共有ボタン →「ホーム画面に追加」で、アプリのように1タップで開けます。</p>
      <button id="btnAddToHomeClose" class="iconbtn" aria-label="閉じる">×</button>
    </div>

    <div id="resumeBox" hidden>
      <button id="btnResume" class="btn btn-primary btn-lg btn-hero"></button>
    </div>

    <nav class="menu">
      <button id="btnQuick10" class="btn btn-primary btn-lg">
        <span class="menu-title">さくっと10問</span>
        <span class="menu-sub">苦手優先・すきま時間に</span>
      </button>
      <button id="btnMini20" class="btn btn-lg">
        <span class="menu-title">本番形式ミニテスト 20問</span>
        <span class="menu-sub">尺度配分は本番比率</span>
      </button>
      <button id="btnFull120" class="btn btn-lg">
        <span class="menu-title">フル模試 120問・60分</span>
        <span class="menu-sub">通し時計つき本番シミュレーション</span>
      </button>
      <button id="btnFields" class="btn btn-lg">
        <span class="menu-title">分野別に練習</span>
        <span class="menu-sub">尺度・小分野を選んで練習</span>
      </button>
      <button id="btnWeak" class="btn btn-lg">
        <span class="menu-title">苦手だけ集中</span>
        <span class="menu-sub" id="weakCountLabel">—</span>
      </button>
      <button id="btnWrongNote" class="btn btn-lg">
        <span class="menu-title">間違いノート</span>
        <span class="menu-sub" id="wrongCountLabel">—</span>
      </button>
      <button id="btnFlagged" class="btn btn-lg">
        <span class="menu-title">★ 見返す問題</span>
        <span class="menu-sub" id="flagCountLabel">—</span>
      </button>
    </nav>

    <div id="weakGuide" class="guide" hidden>
      <p>苦手判定はまだできません。まず50問ほど解いてください。</p>
      <button id="btnWeakGuideGo" class="btn btn-primary">さくっと10問へ</button>
    </div>

    <div class="menu menu-secondary">
      <button id="btnStats" class="btn btn-outline">学習記録</button>
      <button id="btnSettings" class="btn btn-outline">設定</button>
    </div>

    <div class="today-strip" id="todayStrip"></div>
  </div>
</section>

<section id="view-fields" class="view" hidden>
  <header class="subbar">
    <button id="fieldsBack" class="iconbtn" aria-label="戻る">‹</button>
    <div class="subbar-title" id="fieldsTitle">分野別に練習</div>
  </header>
  <div class="fields-wrap" id="fieldsList"></div>
</section>

<section id="view-quiz" class="view" hidden>
  <div class="quiz-hud">
    <div class="hud">
      <button id="quizAbort" class="iconbtn" aria-label="中断">×</button>
      <div class="hud-mid">
        <div class="hud-cat" id="hudCat"></div>
        <div class="hud-pos" id="hudPos"></div>
      </div>
      <div class="hud-clock" id="hudClock"></div>
    </div>
    <div class="hud-overall" id="hudOverall" hidden></div>

 {id:"eig-049",cat:"英語",sub:"前置詞",q:"次の空欄に入る語として正しいものはどれか。",s:"I'm afraid ( ) dogs.",o:["from","of","at","with"],a:1,e:"be afraid of ~ で「〜を恐れる」という意味です。",lv:1},
 {id:"eig-050",cat:"英語",sub:"前置詞",q:"次の空欄に入る語として正しいものはどれか。",s:"Please wait ( ) me at the station.",o:["to","at","for","on"],a:2,e:"wait for ~ で「〜を待つ」という意味です。",lv:1},
{ id:"eig-051", cat:"英語", sub:"文法・時制", q:"空所に入る最も適切な語句を選べ。", s:"I ( ) here since 2020.", o:["have lived","live","lived","am living"], a:0, e:"sinceは「〜以来」を表し、過去から現在まで続く状態は現在完了で表す。", lv:1 },
  { id:"eig-052", cat:"英語", sub:"文法・時制", q:"空所に入る最も適切な語句を選べ。", s:"By the time she arrived, the meeting already ( ).", o:["started","had started","has started","starts"], a:1, e:"過去のある時点までに完了していたことは過去完了(had+過去分詞)で表す。", t:"alreadyは肯定文、yetは疑問文・否定文でよく使われる。", lv:2 },
  { id:"eig-053", cat:"英語", sub:"文法・時制", q:"空所に入る最も適切な語句を選べ。", s:"Look at those clouds! It ( ) rain soon.", o:["will","would","is going to","has"], a:2, e:"目に見える証拠に基づく予測にはbe going toを使う。", lv:2 },
  { id:"eig-054", cat:"英語", sub:"文法・時制", q:"空所に入る最も適切な語句を選べ。", s:"I ( ) my dentist tomorrow afternoon.", o:["see","saw","have seen","am seeing"], a:3, e:"確定した予定はam/is/are+doing(現在進行形)で表せる。", t:"willは瞬間的な決定、be going toは既定の予定に使うと覚える。", lv:2 },
  { id:"eig-055", cat:"英語", sub:"文法・時制", q:"空所に入る最も適切な語を選べ。", s:"We have known each other ( ) ten years.", o:["for","since","during","while"], a:0, e:"forは期間の長さ、sinceは起点を表す。ten yearsは期間なのでforが正しい。", lv:1 },
  { id:"eig-056", cat:"英語", sub:"文法・時制", q:"空所に入る最も適切な語句を選べ。", s:"I ( ) dinner when the phone rang.", o:["cook","was cooking","cooked","have cooked"], a:1, e:"過去のある動作の最中に別の出来事が起きたときは過去進行形を使う。", lv:2 },
  { id:"eig-057", cat:"英語", sub:"文法・時制", q:"空所に入る最も適切な語句を選べ。", s:"By next April, he ( ) here for five years.", o:["worked","will work","will have worked","has worked"], a:2, e:"未来のある時点までの完了・継続はwill have+過去分詞(未来完了)で表す。", t:"未来完了はwill haveと「未来のある時点」を表す語句をセットで覚える。", lv:3 },
  { id:"eig-058", cat:"英語", sub:"文法・時制", q:"空所に入る最も適切な語を選べ。", s:"I have ( ) finished my homework.", o:["yesterday","ago","last night","just"], a:3, e:"just, already, yetなどは現在完了とともによく使う副詞。過去の一点を示す語とは併用しない。", lv:1 },

  { id:"eig-059", cat:"英語", sub:"文法・関係詞", q:"空所に入る最も適切な語を選べ。", s:"The man ( ) car was stolen called the police.", o:["whose","who","whom","which"], a:0, e:"後ろに名詞(car)が続き所有を表すのでwhoseを使う。", lv:3 },
  { id:"eig-060", cat:"英語", sub:"文法・関係詞", q:"空所に入る最も適切な語を選べ。", s:"She is the woman ( ) helped me yesterday.", o:["which","who","whose","whom"], a:1, e:"先行詞が人で、関係詞節の中で主語の働きをするのでwhoを使う。", t:"先行詞が人か物かでwho/whichを使い分ける。", lv:2 },
  { id:"eig-061", cat:"英語", sub:"文法・関係詞", q:"空所に入る最も適切な語を選べ。", s:"He passed the exam, ( ) surprised everyone.", o:["that","what","which","who"], a:2, e:"前の文全体を先行詞とする非制限用法の関係代名詞はwhichを使う。", lv:3 },
  { id:"eig-062", cat:"英語", sub:"文法・関係詞", q:"空所に入る最も適切な語を選べ。", s:"This is the town ( ) I was born.", o:["which","who","whose","where"], a:3, e:"先行詞が場所で、関係詞節が完全な文になっているのでwhereを使う。", lv:2 },
  { id:"eig-063", cat:"英語", sub:"文法・関係詞", q:"空所に入る最も適切な語を選べ。", s:"( ) he said was true.", o:["What","That","Which","Who"], a:0, e:"先行詞を含む関係代名詞whatは「〜すること・もの」を表し、文頭で主語になれる。", lv:2 },
  { id:"eig-064", cat:"英語", sub:"文法・関係詞", q:"次の文の空所に入れられないものはどれか。", s:"This is the book ( ) I bought yesterday.", o:["which","whom","that","(省略可)"], a:1, e:"先行詞the bookは物なのでwhomは使えない。目的格の関係代名詞は省略も可能。", t:"目的格の関係代名詞は省略できることも覚えておこう。", lv:2 },

  { id:"eig-065", cat:"英語", sub:"文法・仮定法", q:"空所に入る最も適切な語を選べ。", s:"If I ( ) you, I would apologize.", o:["am","was","were","be"], a:2, e:"仮定法過去では主語に関わらずbe動詞はwereを使うのが原則。", lv:1 },
  { id:"eig-066", cat:"英語", sub:"文法・仮定法", q:"空所に入る最も適切な語句を選べ。", s:"If she had studied harder, she ( ) the exam.", o:["would pass","passes","had passed","would have passed"], a:3, e:"仮定法過去完了はif+had+過去分詞, 主語+would have+過去分詞の形をとる。", lv:3 },
  { id:"eig-067", cat:"英語", sub:"文法・仮定法", q:"空所に入る最も適切な語を選べ。", s:"I wish I ( ) more free time.", o:["had","have","will have","having"], a:0, e:"現在の事実に反する願望はwish+主語+過去形で表す。", t:"wish+過去形は現在の願望、wish+had+過去分詞は過去の願望を表す。", lv:1 },
  { id:"eig-068", cat:"英語", sub:"文法・仮定法", q:"空所に入る最も適切な語句を選べ。", s:"I wish I ( ) the truth earlier.", o:["knew","had known","know","have known"], a:1, e:"過去の事実に反する願望はwish+主語+had+過去分詞で表す。", lv:3 },
  { id:"eig-069", cat:"英語", sub:"文法・仮定法", q:"空所に入る最も適切な語を選べ。", s:"He talks as if he ( ) everything.", o:["knows","known","knew","has known"], a:2, e:"as ifの後で現実と異なる内容を述べるときは過去形(仮定法過去)を使う。", t:"as ifの後は現実との違いを表すため、時制を一つ過去にずらすのが基本。", lv:2 },

  { id:"eig-070", cat:"英語", sub:"文法・比較", q:"空所に入る最も適切な語句を選べ。", s:"This bag is ( ) as that one.", o:["heavy","heavier","the heaviest","as heavy"], a:3, e:"原級比較はas+形容詞の原級+asの形で表す。", lv:2 },
  { id:"eig-071", cat:"英語", sub:"文法・比較", q:"空所に入る最も適切な語句を選べ。", s:"The more you practice, ( ) you become.", o:["the better","better","the best","good"], a:0, e:"「〜すればするほど…」はthe+比較級, the+比較級の構文で表す。", lv:2 },
  { id:"eig-072", cat:"英語", sub:"文法・比較", q:"空所に入る最も適切な語句を選べ。", s:"Mt. Fuji is ( ) mountain in Japan.", o:["higher","the highest","highest","the higher"], a:1, e:"最上級には通常theを付ける。the+最上級で「最も〜」を表す。", lv:2 },
  { id:"eig-073", cat:"英語", sub:"文法・比較", q:"次の文とほぼ同じ意味になるものを選べ。", s:"Tom is not as tall as Ken.", o:["Tom is taller than Ken.","Tom and Ken are the same height.","Ken is taller than Tom.","Ken is not tall."], a:2, e:"「TomはKenほど背が高くない」は「Kenの方が背が高い」と同義。", t:"notを含む比較の文は、逆の立場から言い換えると意味を取りやすい。", lv:2 },
  { id:"eig-074", cat:"英語", sub:"文法・比較", q:"空所に入る最も適切な語を選べ。", s:"This question is ( ) difficult than the last one.", o:["fewer","least","the less","less"], a:3, e:"数えられない性質・程度の少なさはlessで表す。fewerは数えられる名詞に使う。", lv:3 },

  { id:"eig-075", cat:"英語", sub:"不規則動詞", q:"goの過去分詞形として正しいものはどれか。", o:["gone","went","goed","going"], a:0, e:"go-went-goneと変化する。過去分詞はgone。", lv:1 },
  { id:"eig-076", cat:"英語", sub:"不規則動詞", q:"breakの過去形として正しいものはどれか。", o:["breaked","broke","broken","break"], a:1, e:"break-broke-brokenと変化する。過去形はbroke。", t:"不規則動詞の変化は語呂合わせで覚えると忘れにくい。", lv:1 },
  { id:"eig-077", cat:"英語", sub:"不規則動詞", q:"空所に入る最も適切な語を選べ。", s:"I have already ( ) the letter.", o:["wrote","writing","written","writes"], a:2, e:"write-wrote-writtenと変化する。現在完了には過去分詞writtenを使う。", lv:2 },
  { id:"eig-078", cat:"英語", sub:"不規則動詞", q:"空所に入る最も適切な語を選べ。", s:"The concert ( ) at seven last night.", o:["begun","begins","beginned","began"], a:3, e:"begin-began-begunと変化する。過去形はbegan。", lv:1 },
  { id:"eig-079", cat:"英語", sub:"不規則動詞", q:"動詞の変化(原形-過去形-過去分詞)が誤っているものはどれか。", o:["catch-catched-caught","eat-ate-eaten","choose-chose-chosen","bring-brought-brought"], a:0, e:"catchの正しい変化はcatch-caught-caughtで、catchedという形は存在しない。", t:"catch-caught, teach-taughtのように-ght型の変化をまとめて覚えると良い。", lv:2 },

  { id:"eig-080", cat:"英語", sub:"会話表現", q:"Bの応答として最も自然なものを選べ。", s:"A: Could you pass me the salt? / B: ( )", o:["Nice to meet you.","Sure, here you are.","See you later.","I'm fine, thanks."], a:1, e:"依頼に応じるときはSure, here you are.のような表現が自然。", lv:1 },
  { id:"eig-081", cat:"英語", sub:"会話表現", q:"Bの応答として最も自然なものを選べ。", s:"A: How about going for a walk? / B: ( )", o:["You're welcome.","Excuse me.","That sounds great.","I'm sorry to hear that."], a:2, e:"提案に賛成するときはThat sounds great.などの表現を使う。", lv:1 },
  { id:"eig-082", cat:"英語", sub:"会話表現", q:"Bの応答として最も自然なものを選べ。", s:"A: Excuse me, may I sit here? / B: ( )", o:["It's very kind of you.","Yes, please.","Not at all, thanks.","Sure, go ahead."], a:3, e:"許可を求める May I ~? には Sure, go ahead.（どうぞ）で応じる。", t:"許可を求める疑問文には、承諾か断りかをはっきり示す表現を選ぶ。", lv:2 },
  { id:"eig-083", cat:"英語", sub:"会話表現", q:"Bの応答として最も自然なものを選べ。", s:"A: I'm sorry I'm late. / B: ( )", o:["That's all right.","You're welcome.","I hope so.","Congratulations."], a:0, e:"謝罪への返答としてはThat's all right.(大丈夫ですよ)が適切。", lv:1 },
  { id:"eig-084", cat:"英語", sub:"会話表現", q:"Bの応答として最も自然なものを選べ。", s:"A: Would you like some more coffee? / B: ( )", o:["Yes, I am.","No, thank you. I'm fine.","I'm sorry, I can't.","No, I don't."], a:1, e:"勧められたものを断るときはNo, thank you. I'm fine.のように答える。", lv:1 },
  { id:"eig-085", cat:"英語", sub:"会話表現", q:"Bの応答として最も自然なものを選べ。", s:"A: How long does it take to get to the station? / B: ( )", o:["I like the station.","It's on Monday.","About ten minutes by bus.","I go there every day."], a:2, e:"所要時間を尋ねる質問には具体的な時間で答える。", t:"How longの質問には具体的な時間や期間で答える。", lv:2 },

  { id:"eig-086", cat:"英語", sub:"長文読解", q:"本文の内容と一致するものはどれか。", s:"Many cities are building more bicycle lanes. This helps reduce traffic jams. It also lowers air pollution. Riding a bike is good exercise, too. In some countries, more people now bike to work than before. Local governments often give money to support these programs. Bicycle sharing systems have become popular in big cities. They let people rent bikes for short trips easily.", o:["自転車通勤をする人は年々減っている。","自転車シェアリングの人気は落ちている。","自治体は自転車政策に資金を出さない。","自転車道の整備は渋滞緩和に役立つ。"], a:3, e:"本文2文目に、自転車道の整備は交通渋滞を減らすのに役立つとある。", lv:1 },
  { id:"eig-087", cat:"英語", sub:"長文読解", q:"本文によると、水分不足で起こりやすいものはどれか。", s:"Water is essential for all living things. The human body is about sixty percent water. We lose water every day through sweat and breathing. That is why we need to drink water regularly. Doctors often suggest drinking about two liters a day. However, the right amount can change with exercise and weather. Drinking too little water can cause headaches and tiredness. Drinking enough water keeps our brain and body working well.", o:["頭痛や疲労感","視力の向上","体重の増加","筋肉の強化"], a:0, e:"本文後半に、水分が少なすぎると頭痛や疲労感を引き起こすとある。", lv:1 },
  { id:"eig-088", cat:"英語", sub:"長文読解", q:"在宅勤務について本文が述べていないことはどれか。", s:"Many companies now let employees work from home. This can save time and money on commuting. Workers often feel more relaxed at home. However, some people miss talking with coworkers in person. Managers sometimes worry about checking on progress. Many companies now use online meetings instead. Some workers say they focus better without office noise. Others find it hard to separate work from daily life.", o:["通勤時間や交通費を減らせる。","全ての社員が満足している。","同僚と話す機会が減る。","オンライン会議で連絡を取る。"], a:1, e:"本文には満足していない人もいると書かれており、全員が満足しているとは述べていない。", t:"「述べられていないこと」を選ぶ問題は消去法で確実な記述を除いていく。", lv:3 },
  { id:"eig-089", cat:"英語", sub:"長文読解", q:"本文によると、就寝前の読書がスマホより良い理由は何か。", s:"Reading books before bed can help people relax. It is often better than looking at a phone screen. Phone light can make it harder to fall asleep. Reading a paper book does not have this problem. Some studies show that reading lowers stress levels. A calm mind usually leads to better sleep. Even ten minutes of reading can make a difference. Try turning off your phone and picking up a book tonight.", o:["本が安いから","内容が面白いから","スマホの光で寝つきが悪くなるから","スマホが重すぎるから"], a:2, e:"本文に、スマホの光は寝つきを悪くするので紙の本の方が問題がないとある。", lv:2 },
  { id:"eig-090", cat:"英語", sub:"長文読解", q:"本文の内容と一致するものはどれか。", s:"Farmers around the world face new problems from climate change. Rain patterns are becoming less predictable. Some areas now get too much rain, causing floods. Other areas get too little, causing droughts. These changes make it harder to plan when to plant crops. Scientists are developing new types of seeds that can survive harsh weather. Farmers are also learning new ways to save water. Working together, they hope to keep producing enough food.", o:["全地域で雨が増えている。","科学者は種子開発をやめた。","農家は節水を学んでいない。","雨量が予測しにくくなっている。"], a:3, e:"本文2文目に、雨のパターンが予測しにくくなっているとある。", lv:2 },

  { id:"eig-091", cat:"英語", sub:"発音・アクセント", q:"下線部の発音が他と異なるものはどれか。", o:["fo【o】d","c【oo】k","b【oo】k","l【oo】k"], a:0, e:"foodの【oo】は/uː/と発音するが、他は短い/ʊ/と発音する。", t:"母音字ooやeaは単語によって発音が変わるので個別に覚える。", lv:2 },
  { id:"eig-092", cat:"英語", sub:"発音・アクセント", q:"下線部の発音が他と異なるものはどれか。", o:["br【ea】d","s【ea】","h【ea】d","w【ea】ther"], a:1, e:"seaの【ea】は/iː/と発音するが、他は/e/と発音する。", lv:2 },
  { id:"eig-093", cat:"英語", sub:"発音・アクセント", q:"最も強く発音する部分の位置が他と異なるものはどれか。", o:["【pho】to","【mu】sic","de【sign】","【pa】per"], a:2, e:"designは第2音節にアクセントがあるが、他は第1音節にアクセントがある。", lv:3 },
  { id:"eig-094", cat:"英語", sub:"発音・アクセント", q:"下線部の発音が他と異なるものはどれか。", o:["【ch】air","【ch】eese","【ch】oose","【Ch】ristmas"], a:3, e:"Christmas の ch は /k/ と発音するが、他は /tʃ/ と発音する。", t:"ギリシャ語由来の語（chemistry, character, chorus）の ch は /k/ になりやすい。", lv:3 },
  { id:"eig-095", cat:"英語", sub:"発音・アクセント", q:"最も強く発音する部分の位置が他と異なるものはどれか。", o:["ho【tel】","【ta】ble","【win】dow","【gar】den"], a:0, e:"hotelは第2音節にアクセントがあるが、他は第1音節にアクセントがある。", t:"アクセント問題は品詞で位置が変わる単語に注意する。", lv:1 },
// ==== 既存問題（scoa-jissen-drill.html「言語」より取り込み。q/o/a/e/tは変更なし） ====
 {id:"gen-001",cat:"言語",sub:"四字熟語",q:"「呉越同舟」の意味として正しいものはどれか。",o:["少人数で大軍に立ち向かうこと","仲の悪い者同士が同じ場に居合わせること","昔からの習慣を守り続けること","二つの物事が両立しないこと"],a:1,e:"敵対する呉と越の人間が同じ舟に乗り合わせた故事から。転じて、協力せざるを得ない状況も指します。",lv:2},
 {id:"gen-002",cat:"言語",sub:"二字熟語",q:"「需要」の対義語として正しいものはどれか。",o:["供給","消費","生産","流通"],a:0,e:"求める側が需要、与える側が供給。経済用語の基本的な対義語です。",t:"輸出⇔輸入、収入⇔支出もセットで確認を。",lv:1},
 {id:"gen-003",cat:"言語",sub:"慣用句・ことわざ",q:"「情けは人のためならず」の本来の意味として正しいものはどれか。",o:["情けをかけるとその人のためにならない","人に親切にすれば巡り巡って自分に返る","情けは人によって使い分けるべきだ","人の情けはあてにならない"],a:1,e:"「人のためならず」は「その人のためだけではない」の意。誤用が広まっている代表例です。",lv:2},
 {id:"gen-004",cat:"言語",sub:"二字熟語",q:"「憂慮」の類義語として最も適切なものはどれか。",o:["心配","後悔","警戒","落胆"],a:0,e:"憂慮は事態を心配して思い悩むこと。「懸念」もほぼ同義です。",lv:2},
 {id:"gen-005",cat:"言語",sub:"慣用句・ことわざ",q:"「気が置けない」の意味として正しいものはどれか。",o:["油断ができない","遠慮がいらない","落ち着きがない","気に入らない"],a:1,e:"気を置く必要がない、つまり遠慮せず打ち解けられるという意味です。",t:"誤用率の高い慣用句の代表格。「油断できない」は誤りです。",lv:2},
 {id:"gen-006",cat:"言語",sub:"語句の意味・読み",q:"「収賄」の読みとして正しいものはどれか。",o:["しゅうわい","しゅうぞう","しゅうろ","しゅうかい"],a:0,e:"収賄（しゅうわい）は賄賂を受け取ること。渡す側は贈賄（ぞうわい）です。",t:"公務員として必ず知っておくべき語。倫理面の面接質問にもつながります。",lv:1},
 {id:"gen-007",cat:"言語",sub:"四字熟語",q:"「五里霧中」の意味として正しいものはどれか。",o:["非常に遠い道のりのこと","事情がつかめず方針が立たないこと","休みなく努力し続けること","短期間で大きく成長すること"],a:1,e:"深い霧の中で方向を見失う様子から、手がかりがなく判断がつかない状態を指します。",t:"「五里夢中」は誤字。漢字での出題に注意。",lv:1},
 {id:"gen-008",cat:"言語",sub:"二字熟語",q:"「抽象」の対義語として正しいものはどれか。",o:["具体","現実","客観","詳細"],a:0,e:"抽象⇔具体。客観の対義語は主観です。",lv:1},

 {id:"gen-047",cat:"言語",sub:"文法・語法",q:"次のうち、主語と述語が正しく対応している文はどれか。",o:["私の夢は、医者になりたいです","私の夢は、医者になることです","私の夢は、医者を目指しています","私の夢は、医者として働きたいです"],a:1,e:"主語「夢は」に対応する述語は名詞化した「〜になることです」が正しい形。「〜になりたいです」では主語と述語がねじれます。",lv:3},
 {id:"gen-048",cat:"言語",sub:"文法・語法",q:"次のうち、文法的に正しい表現はどれか。",o:["休日は本を読んだり映画を見る","休日は本を読むや映画を見たり","休日は本を読んだり映画を見たりする","休日は本を読みつつ映画を見たり"],a:2,e:"「〜たり〜たり」は対になって使うのが原則です。「本を読んだり映画を見たりする」が正しい形です。",t:"「たり」は片方だけで終わらせない。必ず対で使う。",lv:1},
 {id:"gen-049",cat:"言語",sub:"文法・語法",q:"「先生は今日、教室に来られる」の「られる」の意味として正しいものはどれか。",o:["受身","自発","可能","尊敬"],a:3,e:"文脈上、先生の動作を敬う表現であり「尊敬」の意味です。「られる」には受身・可能・自発・尊敬の4つの意味があり、文脈で判断します。",lv:3},

 // ==== 新規問題（語句の意味・読み 7問） ====
 {id:"gen-050",cat:"言語",sub:"語句の意味・読み",q:"「相殺」の読みとして正しいものはどれか。",o:["そうさい","そうさつ","あいごろし","そうせつ"],a:0,e:"相殺（そうさい）は互いの利害・貸し借りを打ち消し合うこと。「そうさつ」は誤読として広まっていますが正しくは「そうさい」です。",lv:2},
 {id:"gen-051",cat:"言語",sub:"語句の意味・読み",q:"「出納」の読みとして正しいものはどれか。",o:["しゅつのう","すいとう","でいれ","しゅつなん"],a:1,e:"出納（すいとう）はお金や物品の出し入れのこと。役所や会計の場面でよく使われる語です。",t:"「出納簿」「出納係」など役所でも使われる語。「すいとう」で覚える。",lv:2},
 {id:"gen-052",cat:"言語",sub:"語句の意味・読み",q:"「懸念」の意味として最も適切なものはどれか。",o:["深く後悔すること","強く願うこと","気にかかって心配すること","激しく非難すること"],a:2,e:"懸念（けねん）は物事の先行きが気にかかり、心配すること。ビジネスや行政文書でも頻出の語です。",lv:1},
 {id:"gen-053",cat:"言語",sub:"語句の意味・読み",q:"「逐次」の意味として最も適切なものはどれか。",o:["一斉に","一度きりで","急いで","順を追って次々に"],a:3,e:"逐次（ちくじ）は物事を順序立てて次々に行うこと。「逐次報告する」のように使われます。",lv:2},
 {id:"gen-054",cat:"言語",sub:"語句の意味・読み",q:"「杜撰」の意味として最も適切なものはどれか。",o:["いいかげんで誤りが多いこと","丁寧で几帳面なこと","古くて価値があること","秘密にして人に見せないこと"],a:0,e:"杜撰（ずさん）は詩文などに誤りが多いという故事に由来し、物事の仕方がいいかげんで誤りが多いことを表します。",t:"「ずさん」は日常でも使う語だが漢字での出題に注意。",lv:1},
 {id:"gen-055",cat:"言語",sub:"語句の意味・読み",q:"「遂行」の読みとして正しいものはどれか。",o:["ついこう","すいこう","たいこう","しゅこう"],a:1,e:"遂行（すいこう）は物事を最後までやり遂げること。「任務を遂行する」のように使われます。",lv:2},
 {id:"gen-056",cat:"言語",sub:"語句の意味・読み",q:"「所謂」の読み方として正しいものはどれか。",o:["しょい","しょうげん","いわゆる","ところい"],a:2,e:"「所謂（いわゆる）」は「世間で言われている、つまり」という意味の副詞です。訓読みでの出題が多い語です。",t:"「所謂」「所以（ゆえん）」など訓読みの熟字は頻出。",lv:2},

 // ==== 新規問題（文の並べ替え 4問） ====
 {id:"gen-057",cat:"言語",sub:"文の並べ替え",q:"次のA〜Dを意味が通るように正しく並べ替えたものはどれか。",s:"A．しかし、備えをしておくことで被害を減らせる\nB．そのため、事前の避難訓練が重要である\nC．訓練を重ねることで、いざという時に落ち着いて行動できる\nD．地震はいつ発生するか予測できない",o:["A→D→B→C","D→B→A→C","D→A→C→B","D→A→B→C"],a:3,e:"「地震は予測できない(D)」→「しかし備えで被害を減らせる(A)」→「そのため訓練が重要(B)」→「訓練で落ち着いて行動できる(C)」の流れが自然です。逆接と結論の順番を入れ替えると意味が通らなくなります。",t:"接続語（しかし・そのため等）の前後関係から順序のヒントをつかむ。",lv:2},
 {id:"gen-058",cat:"言語",sub:"文の並べ替え",q:"次のA〜Dを意味が通るように正しく並べ替えたものはどれか。",s:"A．まず材料を洗い、皮をむく\nB．最後に盛り付けて完成させる\nC．次に材料を切りそろえる\nD．そして火にかけて加熱する",o:["A→C→D→B","A→D→C→B","C→A→D→B","A→C→B→D"],a:0,e:"「まず」「次に」「そして」「最後に」という順序を示す語に注目すると、A→C→D→Bの順が自然です。",lv:1},
 {id:"gen-059",cat:"言語",sub:"文の並べ替え",q:"次のA〜Dを意味が通るように正しく並べ替えたものはどれか。",s:"A．そこで、原因を見直すことにした\nB．ところが、実際に試してみると効果がなかった\nC．新しい学習法が話題になった\nD．多くの人がこの方法を試そうとした",o:["C→B→D→A","C→D→B→A","D→C→B→A","C→D→A→B"],a:1,e:"「新しい学習法が話題に(C)」→「多くの人が試そうとした(D)」→「ところが効果がなかった(B)」→「そこで見直すことにした(A)」という展開が自然です。「ところが」の逆接は経緯の後、結果の前に置かれます。",lv:2},
 {id:"gen-060",cat:"言語",sub:"文の並べ替え",q:"次のA〜Dを意味が通るように正しく並べ替えたものはどれか。",s:"A．施設は昨年4月に開業した\nB．今後は周辺の交通整備も課題となる\nC．市は新しい観光施設を建設した\nD．そのため入場者数が大きく増加した",o:["C→D→A→B","D→C→A→B","C→A→D→B","C→A→B→D"],a:2,e:"「市が観光施設を建設した(C)」→「施設は昨年4月に開業した(A)」→「そのため入場者数が増加した(D)」→「今後は交通整備が課題(B)」という時系列と論理展開が自然です。",t:"時系列を示す語（昨年・今後など）から前後関係を絞り込む。",lv:3},

 // ==== 新規問題（長文読解 5問） ====
 {id:"gen-061",cat:"言語",sub:"長文読解",q:"本文の内容と合っているものはどれか。",s:"柏原市に限らず、全国の自治体で上下水道管の老朽化が課題となっている。多くは高度経済成長期に整備されたため、法定耐用年数を超える管路が年々増えている。更新には多額の費用がかかる一方、人口減少で料金収入は伸び悩んでいる。そのため各自治体は、優先順位をつけた計画的な更新や、広域化による効率化を進めている。",o:["更新費用は年々減っている","人口増加で料金収入が伸びている","老朽化した管路は更新が完了した","老朽化が進み、更新費用の確保が課題だ"],a:3,e:"本文は、法定耐用年数を超える管路が増える一方、更新には多額の費用がかかり、人口減少で料金収入は伸び悩んでいると述べています。老朽化の進行と費用確保が課題である、という内容に一致します。",lv:2},
 {id:"gen-062",cat:"言語",sub:"長文読解",q:"本文の内容と合っているものはどれか。",s:"ふるさと納税は、応援したい自治体に寄付をすると、寄付額から2,000円を除いた金額が所得税や住民税から控除される制度である。多くの自治体は寄付への返礼品を用意しており、地場産業の振興にもつながっている。一方で、返礼品競争が過熱し、寄付が特定の自治体に集中する傾向も指摘されている。",o:["寄付額のうち2,000円を除いた分が控除の対象となる","返礼品を用意している自治体は一部に限られる","ふるさと納税は所得税のみが控除の対象である","寄付は必ず自分の住む自治体に対して行う"],a:0,e:"本文に「寄付額から2,000円を除いた金額が所得税や住民税から控除される」とあり、この選択肢と一致します。控除は所得税と住民税の両方が対象で、寄付先は自分の住む自治体に限りません。",t:"控除額や上限額の細かいルールは改正の可能性があるため最新情報も確認を。",lv:2},
 {id:"gen-063",cat:"言語",sub:"長文読解",q:"本文で述べられていないものはどれか。",s:"太陽光や風力といった再生可能エネルギーは、発電時に二酸化炭素をほとんど排出しないという利点がある。一方で、天候によって発電量が変動しやすく、安定した供給が難しいという課題も抱えている。このため、蓄電池の導入や電力需給を調整する仕組みづくりが各地で進められている。",o:["発電時の二酸化炭素排出はごくわずかである","既に電力需要のすべてを賄えている","天候により発電量が変動しやすい","蓄電池の導入が各地で進められている"],a:1,e:"本文では二酸化炭素排出の少なさ、発電量の変動しやすさ、蓄電池導入の進展が述べられていますが、電力需要のすべてを賄えているとは述べられていません。むしろ安定供給が難しいという課題が残ると書かれています。",lv:3},
 {id:"gen-064",cat:"言語",sub:"長文読解",q:"筆者の主張として最も適切なものはどれか。",s:"日本では高齢化の進展にともない、住み慣れた地域で医療や介護、生活支援を受けられる体制づくりが求められている。この考え方は地域包括ケアシステムと呼ばれ、市町村が中心となって医療機関や介護事業者、住民同士の支え合いを組み合わせて構築していくことが目指されている。",o:["医療機関だけで対応すべきだ","都道府県が主導して整備すべきだ","市町村中心で地域ぐるみの体制を築くべきだ","介護保険制度の見直しが最優先の課題だ"],a:2,e:"本文は、高齢化に伴い住み慣れた地域で支援を受けられる体制として、市町村が中心となって医療・介護・地域の支え合いを組み合わせる地域包括ケアシステムの構築を目指すべきだと述べています。",lv:3},
 {id:"gen-065",cat:"言語",sub:"長文読解",q:"本文の内容と合っているものはどれか。",s:"全国的に空き家の増加が問題となっている。所有者が管理を怠ると、建物の老朽化により倒壊や景観の悪化、防犯上のリスクが高まる。国や自治体は空家対策特別措置法などにもとづき、危険な空き家の所有者に改善を促し、それでも改善されない場合は行政が撤去などの措置をとれる仕組みを整えている。",o:["空き家問題は特に注視されていない","所有者が管理を怠っても行政は無関係だ","特別措置法は増加防止のみが目的だ","行政が改善や撤去を促す仕組みがある"],a:3,e:"本文には、管理が不十分な空き家について自治体が改善を促し、それでも改善されない場合は行政が撤去などの措置をとれる仕組みが整えられているとあり、この内容と一致します。",lv:3},

 {id:"jos-001",cat:"常識",sub:"政治・憲法",lv:1,q:"日本国憲法の三大原則の組み合わせとして正しいものはどれか。",o:["国民主権・基本的人権の尊重・平和主義","三権分立・法の下の平等・平和主義","国民主権・議院内閣制・地方自治","基本的人権の尊重・三権分立・国民主権"],a:0,e:"三大原則は国民主権、基本的人権の尊重、平和主義。三権分立は統治の仕組みで、原則には含まれません。",t:"面接で「公務員の使命」を語る場面にも使えます。"},
 {id:"jos-002",cat:"常識",sub:"地方自治",lv:2,q:"市町村長の被選挙権が認められる年齢はどれか。",o:["満18歳以上","満20歳以上","満25歳以上","満30歳以上"],a:2,e:"市町村長・市町村議会議員・衆議院議員は満25歳以上。都道府県知事と参議院議員は満30歳以上です。",t:"「知事と参議院だけ30歳」で整理する。"},
 {id:"jos-003",cat:"常識",sub:"地方自治",lv:2,q:"地方自治法にもとづき、住民が条例の制定・改廃を請求する場合に必要な署名数はどれか。",o:["有権者の50分の1以上","有権者の10分の1以上","有権者の3分の1以上","有権者の過半数"],a:0,e:"条例の制定・改廃と監査の請求は50分の1以上。議会の解散や首長の解職請求は原則3分の1以上です。",t:"「人の職が飛ぶ請求は3分の1、それ以外は50分の1」。"},
 {id:"jos-004",cat:"常識",sub:"政治・憲法",lv:2,q:"三権分立において、内閣が裁判所に対して持つ権限はどれか。",o:["違憲立法審査","最高裁判所長官の指名","弾劾裁判所の設置","国政調査"],a:1,e:"内閣は最高裁判所長官を指名し、その他の裁判官を任命します。弾劾裁判所の設置と国政調査は国会の権限です。"},
 {id:"jos-005",cat:"常識",sub:"経済",lv:2,q:"為替が円高に進んだとき、一般に起こることとして正しいものはどれか。",o:["輸出企業の採算が改善する","輸入品の価格が下がる","日本人の海外旅行費用が割高になる","訪日外国人にとって日本での買い物が割安になる"],a:1,e:"円高では円の価値が上がるため輸入品は安くなります。輸出は不利、海外旅行は割安、訪日客には割高です。",t:"「円高＝円が強い＝買う側が得」で一本化する。"},
 {id:"jos-006",cat:"常識",sub:"地理",lv:1,q:"日本の最南端に位置する島はどれか。",o:["南鳥島","与那国島","沖ノ鳥島","波照間島"],a:2,e:"最南端は沖ノ鳥島、最東端は南鳥島、最西端は与那国島、最北端は択捉島です。",t:"「南は沖ノ鳥、東は南鳥」が入れ替わるひっかけに注意。"},
 {id:"jos-007",cat:"常識",sub:"地理",lv:1,q:"世界文化遺産「百舌鳥・古市古墳群」が所在する都道府県はどれか。",o:["奈良県","大阪府","京都府","兵庫県"],a:1,e:"堺市、羽曳野市、藤井寺市にまたがる大阪府の世界文化遺産です。",t:"柏原市の近隣。地元の地理として面接でも話題にできます。"},
 {id:"jos-008",cat:"常識",sub:"日本史",lv:1,q:"大化の改新を進めた中心人物の組み合わせとして正しいものはどれか。",o:["聖徳太子と蘇我馬子","中大兄皇子と中臣鎌足","天武天皇と持統天皇","桓武天皇と坂上田村麻呂"],a:1,e:"中大兄皇子（のちの天智天皇）と中臣鎌足が蘇我氏を倒し、公地公民を柱とする改革を進めました。"},
 {id:"jos-009",cat:"常識",sub:"物理",lv:2,q:"支点から2mの位置に10kgのおもりをつるした。反対側の支点から1mの位置に何kgのおもりをつるすとつり合うか。",o:["5kg","10kg","15kg","20kg"],a:3,e:"（重さ×支点からの距離）が左右で等しいときつり合う。10×2＝20、20÷1＝20kg。",t:"モーメントの基本。構造力学の出発点なので土木受験者は必答。"},
 {id:"jos-010",cat:"常識",sub:"化学",lv:1,q:"うすい塩酸に水酸化ナトリウム水溶液を加えて中和させたとき、生じる塩はどれか。",o:["塩化ナトリウム","炭酸ナトリウム","硫酸ナトリウム","塩化カルシウム"],a:0,e:"HCl + NaOH → NaCl + H₂O。酸の陰イオンとアルカリの陽イオンが結びついて塩ができます。",t:"中和では必ず水ができる、と押さえる。"},
 {id:"jos-011",cat:"常識",sub:"生物",lv:1,q:"だ液に含まれる消化酵素アミラーゼが分解するものはどれか。",o:["タンパク質","脂肪","デンプン","繊維質"],a:2,e:"アミラーゼはデンプンを麦芽糖に分解します。タンパク質はペプシン、脂肪はリパーゼが担当します。"},
 {id:"jos-012",cat:"常識",sub:"地学",lv:2,q:"地震において初期微動を引き起こす波と、その性質の説明として正しいものはどれか。",o:["S波で、P波より速く伝わる","P波で、S波より速く伝わる","P波で、S波より遅く伝わる","表面波で、最も速く伝わる"],a:1,e:"P波（縦波）が先に到達して初期微動を起こし、遅れて届くS波（横波）が主要動を起こします。この差が初期微動継続時間です。",t:"緊急地震速報はP波を検知する仕組み。防災の面接質問にもつながります。"},
