 {id:"jos-014",cat:"常識",sub:"政治・憲法",lv:1,q:"日本国憲法が保障する社会権に分類されるものはどれか。",o:["生存権","表現の自由","財産権","参政権"],a:0,e:"生存権は社会権に分類されます。表現の自由・財産権は自由権、参政権は別の独立した権利です。"},
 {id:"jos-015",cat:"常識",sub:"政治・憲法",lv:3,q:"最高裁判所裁判官の国民審査が行われるタイミングとして正しいものはどれか。",o:["参議院議員通常選挙のたびに毎回","4年ごとに単独で実施","就任時に一度だけ実施","初回は任命後の衆院選、以後10年ごと"],a:3,e:"最高裁裁判官は任命後初めての衆院選で国民審査を受け、以後は前回審査から10年経過後の衆院選ごとに審査されます。"},
 {id:"jos-016",cat:"常識",sub:"政治・憲法",lv:2,q:"衆議院で可決した法律案を参議院が否決した場合、衆議院が再可決して成立させる条件はどれか。",o:["出席議員の3分の2以上の多数で再可決","出席議員の過半数で再可決","両院協議会の全会一致","内閣の承認"],a:0,e:"法律案は衆議院の出席議員の3分の2以上の多数で再可決すれば成立します（衆議院の優越）。"},
 {id:"jos-017",cat:"常識",sub:"政治・憲法",lv:3,q:"日本国憲法の改正を発議するために必要な国会の議決要件はどれか。",o:["衆参各院の出席議員の過半数","衆参各院の出席議員の3分の2以上","各議院の総議員の3分の2以上","内閣の閣議決定のみ"],a:2,e:"憲法改正の発議には各議院の総議員（出席議員ではない）の3分の2以上の賛成が必要で、その後国民投票にかけられます。",t:"「総議員」か「出席議員」かの違いがひっかけになりやすい。"},
 {id:"jos-018",cat:"常識",sub:"政治・憲法",lv:2,q:"裁判官として著しく不適切な行為があった裁判官の罷免の可否を判断する、国会に設けられる機関はどれか。",o:["行政委員会","国政調査会","参議院法制局","弾劾裁判所"],a:3,e:"弾劾裁判所は国会に設置され、衆参各議院の議員で組織されます。裁判官の罷免の可否を判断します。"},
 {id:"jos-019",cat:"常識",sub:"政治・憲法",lv:1,q:"国会が証人喚問や記録の提出を求め、国政に関する調査を行う権限を何というか。",o:["国政調査権","違憲審査権","弾劾裁判権","条約締結権"],a:0,e:"国政調査権は衆参各議院が持つ権限で、証人喚問や記録提出要求を通じて行政を監視します。条約締結は内閣の権限です。"},
 {id:"jos-020",cat:"常識",sub:"政治・憲法",lv:1,q:"法律や行政処分が憲法に違反していないかを最終的に判断する機関はどれか。",o:["内閣法制局","最高裁判所","国会","会計検査院"],a:1,e:"違憲審査権はすべての裁判所が持ちますが、最終的な判断権を持つのは最高裁判所で「憲法の番人」と呼ばれます。"},

 // 地方自治（新規6・面接直結のため丁寧に）
 {id:"jos-021",cat:"常識",sub:"地方自治",lv:2,q:"地方公共団体で首長と議会議員がともに住民の直接選挙で選ばれる仕組みを何というか。",o:["議院内閣制","首長優位制","二元代表制","代表民主制"],a:2,e:"地方自治体では首長（知事・市町村長）と議会議員をそれぞれ住民が直接選挙で選ぶ二元代表制がとられます。",t:"国は議院内閣制、地方は二元代表制。面接の定番論点。"},
 {id:"jos-022",cat:"常識",sub:"地方自治",lv:3,q:"地方交付税交付金の主な目的として正しいものはどれか。",o:["特定の事業の実施を条件に配分される","返済義務のある借入金である","国政選挙の得票に応じて配分される","地方公共団体間の財政格差を是正する"],a:3,e:"地方交付税は使途を限定しない一般財源で、団体間の財政力格差を是正するために国が交付します。",t:"使い道自由が地方交付税、使途限定が国庫支出金。"},
 {id:"jos-023",cat:"常識",sub:"地方自治",lv:1,q:"地方公共団体の予算を議決する機関はどこか。",o:["議会","首長","監査委員","選挙管理委員会"],a:0,e:"予算の調製・提出は首長が行いますが、議決するのは議会の権限です。議決を経て予算が成立します。"},
 {id:"jos-024",cat:"常識",sub:"地方自治",lv:2,q:"有権者が地方議会の解散を請求する場合に必要な署名数はどれか（原則）。",o:["有権者の50分の1以上","有権者の3分の1以上","有権者の2分の1以上","有権者の4分の1以上"],a:1,e:"議会の解散請求や首長・議員の解職請求（リコール）には原則として有権者の3分の1以上の署名が必要です。",t:"人の地位に関わる請求ほどハードルが高いと覚える。"},
 {id:"jos-025",cat:"常識",sub:"地方自治",lv:2,q:"住民が財務会計上の違法・不当な行為の是正を監査委員に求める制度を何というか。",o:["住民訴訟","情報公開請求","住民監査請求","行政不服審査"],a:2,e:"住民監査請求は監査委員に是正措置を求める制度。結果に不服がある場合、裁判所に住民訴訟を提起できます。"},
 {id:"jos-026",cat:"常識",sub:"地方自治",lv:1,q:"地方公共団体の条例を制定する権限を持つのはどこか。",o:["首長","教育委員会","住民全体の直接投票","議会"],a:3,e:"条例は地方公共団体の議会が制定します。首長が定めるのは規則で、条例より効力の面で下位に位置づけられます。"},

 // 経済（新規7）
 {id:"jos-027",cat:"常識",sub:"経済",lv:1,q:"物価が持続的に下落し、貨幣の実質的な価値が上がる現象を何というか。",o:["インフレーション","スタグフレーション","円高","デフレーション"],a:3,e:"デフレーションは物価が持続的に下落する現象。お金の価値は相対的に上がりますが、不況を招くこともあります。"},
 {id:"jos-028",cat:"常識",sub:"経済",lv:2,q:"日本銀行が持つ「発券銀行」としての役割の説明として正しいものはどれか。",o:["日本銀行券（紙幣）を発行する","国の予算を編成する","市中銀行に一般の口座を開設する","為替レートを法律で固定する"],a:0,e:"日本銀行は日本銀行券を発行する唯一の発券銀行で、政府の銀行、銀行の銀行としての役割も持ちます。",t:"発券銀行・政府の銀行・銀行の銀行の3役割をセットで覚える。"},
 {id:"jos-029",cat:"常識",sub:"経済",lv:3,q:"2023年10月に開始した、消費税の仕入税額控除に適格請求書の保存を必要とする制度を何というか。",o:["電子帳簿保存制度","インボイス制度","ふるさと納税制度","軽減税率制度"],a:1,e:"インボイス（適格請求書等保存方式）制度は2023年10月開始。登録事業者が発行する適格請求書の保存が必要です。"},
 {id:"jos-030",cat:"常識",sub:"経済",lv:2,q:"消費税率が8%から10%に引き上げられたのはいつか。",o:["2014年4月","2017年4月","2019年10月","2021年10月"],a:2,e:"消費税は2014年4月に5%から8%へ、2019年10月に8%から10%へ引き上げられました（食品等は軽減税率8%）。",t:"8%への引き上げは2014年、10%は2019年と時期を混同しない。"},
 {id:"jos-031",cat:"常識",sub:"経済",lv:2,q:"株式会社の株主が負う責任の範囲として正しいものはどれか。",o:["会社の借金全額を無限に負う責任","出資額の2倍までを負う責任","役員のみが無限責任を負う","出資額を限度とする有限責任"],a:3,e:"株式会社の株主は出資した金額を上限とする有限責任を負います。会社が倒産しても出資額以上の負担は原則負いません。"},
 {id:"jos-032",cat:"常識",sub:"経済",lv:3,q:"円安が進んだときに一般的に起こることとして正しいものはどれか。",o:["輸出企業の採算が改善しやすい","輸入品の価格が下がる","日本人の海外旅行費用が割安になる","訪日外国人の日本での買い物が割高になる"],a:0,e:"円安では円の価値が下がるため、外貨建てで受け取る輸出企業の採算は改善しやすくなります。輸入品と海外旅行は割高になります。",t:"既出の円高問題と対にして覚える。"},
 {id:"jos-033",cat:"常識",sub:"経済",lv:1,q:"国内で一定期間に新たに生み出された付加価値の合計を表す指標はどれか。",o:["GNP（国民総生産）","GDP（国内総生産）","CPI（消費者物価指数）","有効求人倍率"],a:1,e:"GDPは国内で生み出された付加価値の合計。「国内」で生産されたかを基準にする点がGNPとの違いです。"},

 // 社会・時事（新規6：定着した制度・過去の出来事のみ）
 {id:"jos-034",cat:"常識",sub:"社会・時事",lv:1,q:"SDGs（持続可能な開発目標）が定める目標の数はいくつか。",o:["8","15","17","20"],a:2,e:"SDGsは2015年の国連サミットで採択された17の目標（ゴール）と169のターゲットから構成されます。",t:"MDGs（8目標）との数の違いに注意。"},
 {id:"jos-035",cat:"常識",sub:"社会・時事",lv:2,q:"2024年12月に新規発行が停止され、マイナンバーカードと一体化した健康保険証への移行が進められている制度の通称はどれか。",o:["電子カルテ","健康ポイント制度","医療費控除制度","マイナ保険証"],a:3,e:"2024年12月2日に紙の健康保険証の新規発行が停止され、マイナ保険証への移行が進んでいます。未取得者には資格確認書が交付されます。",t:"運用の見直しが続く分野。改正に注意。"},
 {id:"jos-036",cat:"常識",sub:"社会・時事",lv:1,q:"2025年に大阪市の夢洲を会場として開催された国際博覧会の愛称はどれか。",o:["大阪・関西万博","大阪国際博覧会2020","近畿未来博","夢洲エキスポ"],a:0,e:"2025年4月13日から10月13日まで、大阪市此花区の夢洲で2025年日本国際博覧会（大阪・関西万博）が開催されました。",t:"地元開催のイベントは面接の話題づくりにも使える。"},
 {id:"jos-037",cat:"常識",sub:"社会・時事",lv:2,q:"建設業にも罰則付きの時間外労働の上限規制が適用されるようになったのはいつからか。",o:["2019年4月","2024年4月","2020年4月","2023年4月"],a:1,e:"働き方改革関連法の猶予期間が終わり、2024年4月から建設業にも時間外労働の上限（原則月45時間・年360時間）が適用されました。",t:"いわゆる「2024年問題」。土木職の受験者は要チェック。"},
 {id:"jos-038",cat:"常識",sub:"社会・時事",lv:2,q:"日本政府が2050年までの実現を掲げる目標として正しいものはどれか。",o:["食料自給率100%の達成","高齢化率の低下","温室効果ガス排出の実質ゼロ","人口1億人の維持"],a:2,e:"2020年に「2050年カーボンニュートラル」（温室効果ガス排出を全体としてゼロにする）が宣言され、環境政策の柱となっています。"},
 {id:"jos-039",cat:"常識",sub:"社会・時事",lv:2,q:"行政のデジタル化を一体的に推進するため2021年に発足した国の行政機関はどれか。",o:["情報通信省","総務省デジタル局","経済産業省デジタル部","デジタル庁"],a:3,e:"デジタル庁は行政のデジタル化を横断的に進めるため2021年9月に発足した内閣直属の組織です。"},

 // 日本史（新規6）
 {id:"jos-040",cat:"常識",sub:"日本史",lv:1,q:"聖徳太子が定めたとされる、豪族・役人の心構えを説いた法はどれか。",o:["十七条の憲法","大宝律令","御成敗式目","武家諸法度"],a:0,e:"十七条の憲法は604年に聖徳太子が定めたとされ、「和を以て貴しとなす」など役人の心得を説きました。"},
 {id:"jos-041",cat:"常識",sub:"日本史",lv:3,q:"鎌倉幕府が国ごとに置いた、軍事・警察を担う役職はどれか。",o:["地頭","守護","国司","勘定奉行"],a:1,e:"守護は国ごとに置かれ軍事・警察を担当、地頭は荘園・公領ごとに置かれ年貢の徴収などを担いました。",t:"「守護は国、地頭は荘園」で区別する。"},
 {id:"jos-042",cat:"常識",sub:"日本史",lv:3,q:"江戸幕府が鎖国体制下でも交易を認めていた組み合わせとして正しいものはどれか。",o:["ポルトガルと大坂で交易","イギリスと江戸で交易","オランダ・中国と長崎で交易","スペインと堺で交易"],a:2,e:"鎖国下でも長崎の出島でオランダ、唐人屋敷で中国（清）との交易が認められ、対馬・薩摩・松前を通じた交易も行われました。"},
 {id:"jos-043",cat:"常識",sub:"日本史",lv:2,q:"1873年に始まった、地券を発行し地価を基準に税を課した明治政府の改革はどれか。",o:["版籍奉還","廃藩置県","殖産興業","地租改正"],a:3,e:"地租改正は土地の地価の3％（後2.5％）を現金で納めさせる税制改革で、明治政府の財政基盤を安定させました。"},
 {id:"jos-044",cat:"常識",sub:"日本史",lv:2,q:"第二次世界大戦後、地主から土地を買い上げ小作人に安く売り渡した改革を何というか。",o:["農地改革","地租改正","殖産興業","農業基本法の制定"],a:0,e:"GHQの指導のもとで行われた農地改革により地主制が解体され、多くの自作農が生まれました。"},
 {id:"jos-045",cat:"常識",sub:"日本史",lv:1,q:"1950年代半ばから1970年代初めにかけて日本経済が急成長した時期を何というか。",o:["バブル経済期","高度経済成長期","戦後復興期","失われた10年"],a:1,e:"高度経済成長期には東京オリンピック（1964年）や大阪万博（1970年）が開催され、重化学工業を中心に経済が急成長しました。",t:"1970年の大阪万博は受験地とも関わる話題。"},

 // 世界史（新規4）
 {id:"jos-046",cat:"常識",sub:"世界史",lv:1,q:"1789年に始まり、自由・平等・友愛を掲げて絶対王政を打倒した出来事はどれか。",o:["名誉革命","産業革命","ロシア革命","フランス革命"],a:3,e:"フランス革命は1789年のバスティーユ牢獄襲撃を契機に始まり、人権宣言が採択されるなど近代市民社会の出発点となりました。"},
 {id:"jos-047",cat:"常識",sub:"世界史",lv:1,q:"18世紀後半にイギリスで始まった、蒸気機関の実用化などによる生産方式の変革を何というか。",o:["産業革命","名誉革命","宗教改革","ルネサンス"],a:0,e:"産業革命は18世紀後半のイギリスで始まり、蒸気機関の実用化や工場制機械工業への転換により社会が大きく変化しました。"},
 {id:"jos-048",cat:"常識",sub:"世界史",lv:2,q:"第一次世界大戦後の1920年に発足した、世界初の国際平和機構はどれか。",o:["国際連合","国際連盟","北大西洋条約機構","世界貿易機関"],a:1,e:"国際連盟は1920年に発足した世界初の国際平和機構。米国不参加のまま発足し、第二次大戦を防げず解体、戦後の国際連合につながりました。",t:"「連盟」は戦前、「連合」は戦後と時期で区別する。"},
 {id:"jos-049",cat:"常識",sub:"世界史",lv:1,q:"1989年に東西冷戦の象徴とされた壁が崩壊した都市はどこか。",o:["モスクワ","ワルシャワ","ベルリン","ウィーン"],a:2,e:"1989年にベルリンの壁が崩壊し、東西ドイツの分断が事実上終わりました。1991年のソ連解体で冷戦は正式に終結しました。"},

 // 地理（新規4・大阪府/近畿を厚めに）
 {id:"jos-050",cat:"常識",sub:"地理",lv:1,q:"大阪府柏原市も流域にあたり、奈良盆地から大阪平野を経て大阪湾に注ぐ河川はどれか。",o:["淀川","猪名川","石川","大和川"],a:3,e:"大和川は奈良県から大阪府柏原市を経て大阪湾に注ぐ一級河川。江戸時代に流路が付け替えられた歴史でも知られます。",t:"柏原市の地理としてそのまま覚えておきたい。"},
 {id:"jos-051",cat:"常識",sub:"地理",lv:3,q:"近畿地方に属さない都道府県はどれか。",o:["岡山県","三重県","滋賀県","奈良県"],a:0,e:"近畿地方は大阪府・京都府・兵庫県・奈良県・和歌山県・滋賀県・三重県の2府5県。岡山県は中国地方です。",t:"三重県は東海のイメージがあるが近畿地方に含まれる点に注意。"},
 {id:"jos-052",cat:"常識",sub:"地理",lv:2,q:"日本三大急流に数えられる河川の組み合わせとして正しいものはどれか。",o:["利根川・信濃川・木曽川","最上川・富士川・球磨川","天竜川・木曽川・長良川","阿賀野川・北上川・淀川"],a:1,e:"日本三大急流は山形県の最上川、山梨県の富士川、熊本県の球磨川。流れが速く古くから治水の難所とされます。"},
 {id:"jos-053",cat:"常識",sub:"地理",lv:1,q:"近畿地方にあり、日本最大の面積を持つ湖はどれか。",o:["浜名湖","霞ヶ浦","琵琶湖","諏訪湖"],a:2,e:"琵琶湖は滋賀県にある日本最大の湖で、近畿地方の水がめとして京阪神の水道水源にもなっています。",t:"淀川水系を通じて大阪府にもつながる、治水上も重要な湖。"},

 // 物理（新規5・てこ/力のつり合い/圧力など土木寄り）
 {id:"jos-054",cat:"常識",sub:"物理",lv:2,q:"底面積2㎡の物体が地面を80Nの力で押しているとき、地面が受ける圧力はどれか。",o:["160Pa","4Pa","0.4Pa","40Pa"],a:3,e:"圧力＝力÷面積で求めます。80N÷2㎡＝40Pa。単位を面積で割ることを忘れないよう注意します。",t:"圧力の単位はPa（パスカル）＝N/㎡。"},
 {id:"jos-055",cat:"常識",sub:"物理",lv:1,q:"水に沈めた物体が受ける浮力の大きさの説明として正しいものはどれか。",o:["物体が押しのけた水の重さに等しい","物体自身の重さに等しい","物体の体積の数値に等しい","水温が高いほど大きくなる"],a:0,e:"浮力の大きさは、物体が押しのけた水（流体）の重さに等しくなります（アルキメデスの原理）。"},
 {id:"jos-056",cat:"常識",sub:"物理",lv:3,q:"動滑車を1つ使って荷物を持ち上げるとき、必要な力について正しいものはどれか（重さは無視する）。",o:["荷物の重さと同じ力が必要で距離も同じ","荷物の重さの半分の力で済むが距離は2倍","荷物の重さの2倍の力が必要になる","力の大きさも距離も変化しない"],a:1,e:"動滑車は力を半分にできますが、その分ロープを引く距離は2倍になります。仕事の量（力×距離）自体は変わりません。",t:"仕事の原理：道具を使っても仕事の総量は変わらない。"},
 {id:"jos-057",cat:"常識",sub:"物理",lv:2,q:"水平な床の上で静止している物体にはたらく力の説明として正しいものはどれか。",o:["重力だけがはたらいている","垂直抗力だけがはたらいている","重力と垂直抗力がつり合っている","摩擦力だけがはたらいている"],a:2,e:"静止する物体には重力と、床が押し返す垂直抗力がはたらき、大きさが等しく向きが逆であるためつり合います。"},
 {id:"jos-058",cat:"常識",sub:"物理",lv:2,q:"長さ6mの棒の中央を支点にし、片方の端に30kgのおもりをつるした。反対の端で支えるために必要な力はどれか。",o:["10kg","15kg","60kg","30kg"],a:3,e:"支点が中央（両端から3mずつ）にあるため、支点からの距離が左右で等しく、つり合いに必要な力もおもりと同じ30kgです。",t:"支点からの距離が同じなら力の大きさも同じになる。"},

 // 化学（新規4）
 {id:"jos-059",cat:"常識",sub:"化学",lv:1,q:"固体が液体を経ずに直接気体になる変化を何というか。",o:["昇華","蒸発","融解","凝縮"],a:0,e:"固体から直接気体になる変化は昇華です。ドライアイス（固体の二酸化炭素）が代表例です。"},
 {id:"jos-060",cat:"常識",sub:"化学",lv:1,q:"物質が酸素と結びつく化学変化を何というか。",o:["還元","酸化","中和","電離"],a:1,e:"物質が酸素と結びつく変化を酸化、酸化物が酸素を失う変化を還元といいます。鉄がさびるのも酸化の一例です。"},
 {id:"jos-061",cat:"常識",sub:"化学",lv:1,q:"石灰水を白く濁らせる性質を持つ気体はどれか。",o:["酸素","水素","二酸化炭素","窒素"],a:2,e:"二酸化炭素を石灰水に通すと炭酸カルシウムの白色沈殿が生じ、白く濁ります。気体の検出によく使われる反応です。"},
 {id:"jos-062",cat:"常識",sub:"化学",lv:3,q:"質量パーセント濃度の求め方として正しいものはどれか。",o:["溶質の質量÷溶媒の質量×100","溶媒の質量÷溶液の質量×100","溶液の質量÷溶質の質量×100","溶質の質量÷溶液の質量×100"],a:3,e:"質量パーセント濃度は溶質の質量を溶液（溶媒＋溶質）全体の質量で割って100をかけて求めます。分母は溶液です。",t:"分母は「溶液」であって「溶媒」ではない点に注意。"},

 // 生物（新規4）
 {id:"jos-063",cat:"常識",sub:"生物",lv:1,q:"植物が光エネルギーを使い二酸化炭素と水からデンプンと酸素をつくるはたらきを何というか。",o:["光合成","呼吸","蒸散","発酵"],a:0,e:"光合成は葉緑体で行われ、二酸化炭素と水、光エネルギーからデンプンなどの有機物と酸素をつくるはたらきです。"},
 {id:"jos-064",cat:"常識",sub:"生物",lv:3,q:"全身から戻ってきた血液を肺へ送り出す心臓の部屋はどこか。",o:["左心室","右心室","左心房","右心房"],a:1,e:"全身から右心房に戻った血液は右心室に入り、右心室の収縮で肺動脈を通じて肺へ送り出されます。",t:"「右心系は肺へ、左心系は全身へ」の流れで整理する。"},
 {id:"jos-065",cat:"常識",sub:"生物",lv:3,q:"対になる遺伝子が減数分裂で分かれ、別々の生殖細胞に入る法則を何というか。",o:["独立の法則","優性の法則","分離の法則","連鎖の法則"],a:2,e:"分離の法則は対立遺伝子が減数分裂で分かれ、それぞれ別の生殖細胞に入るという遺伝の基本法則です。"},
 {id:"jos-066",cat:"常識",sub:"生物",lv:1,q:"生産者がつくった有機物を直接食べる草食動物の生態系上の位置づけはどれか。",o:["生産者","分解者","二次消費者","一次消費者"],a:3,e:"植物などの生産者を直接食べる草食動物は一次消費者と呼ばれます。それを食べる肉食動物は二次消費者です。"},

 // 地学（新規4・地震/地層/気象など防災寄り）
 {id:"jos-067",cat:"常識",sub:"地学",lv:2,q:"地震そのものの規模（エネルギーの大きさ）を表す指標はどれか。",o:["マグニチュード","震度","液状化指数","ハザードマップ"],a:0,e:"マグニチュードは地震そのもののエネルギーの大きさを表す指標。震度は各観測地点の揺れの強さを表す点で異なります。",t:"マグニチュードが1大きくなるとエネルギーは約32倍になる。"},
 {id:"jos-068",cat:"常識",sub:"地学",lv:1,q:"断層で乱されていない地層で一般に成り立つ法則として正しいものはどれか。",o:["上にある地層ほど古い","下にある地層ほど古い","地層の新旧は色で決まる","地層の新旧は判定できない"],a:1,e:"地層は下から順に積み重なるため、乱されていない限り下ほど古く上ほど新しくなります（地層累重の法則）。"},
 {id:"jos-069",cat:"常識",sub:"地学",lv:2,q:"発達した積乱雲が次々発生し同じ場所を通過・停滞して、数時間にわたり強い雨をもたらす現象はどれか。",o:["フェーン現象","移動性高気圧","線状降水帯","偏西風の蛇行"],a:2,e:"線状降水帯は積乱雲が次々に発生・通過して帯状の強い降水域をつくる現象で、近年の集中豪雨災害の主要因です。",t:"気象庁の「顕著な大雨に関する気象情報」のキーワード。"},
 {id:"jos-070",cat:"常識",sub:"地学",lv:1,q:"自然災害による被害の想定範囲や避難場所などを地図上に示したものを何というか。",o:["地質図","天気図","等高線図","ハザードマップ"],a:3,e:"ハザードマップは洪水・土砂災害・地震などによる被害想定範囲や避難場所を示した地図で、多くの市区町村が公表しています。",t:"柏原市も洪水・土砂災害のハザードマップを公表している。"},
{ id:"ron-001", cat:"論理", sub:"命題・対偶", q:"「すべての土木技術者は図面が読める」が真であるとき、確実に正しいものはどれか。", o:["図面が読める人は土木技術者である","図面が読めない人は土木技術者ではない","土木技術者でない人は図面が読めない","図面が読める人の多くは土木技術者である"], a:1, e:"「すべてのAはB」の対偶は「BでないものはAでない」。他はすべて逆か裏です。", lv:1 },
  { id:"ron-002", cat:"論理", sub:"命題・対偶", q:"「AでなければBでない」と同じ意味になるものはどれか。", o:["AならばBである","BならばAである","AでないならばBである","BでないならばAでない"], a:1, e:"「¬A→¬B」の対偶は「B→A」です。", t:"記号に置き換えて対偶を取るのが最短ルート。", lv:2 },
  { id:"ron-003", cat:"論理", sub:"命題・対偶", q:"「雨が降れば、試合は中止になる」が真であるとき、確実に正しいものはどれか。", o:["試合が中止になったなら、雨が降った","雨が降らなければ、試合は中止にならない","試合が中止にならなかったなら、雨は降らなかった","試合が中止になるのは雨のときだけである"], a:2, e:"命題が真ならその対偶も真。「AならばB」の対偶は「BでないならAでない」です。", t:"逆と裏は必ずしも真になりません。最大のひっかけどころ。", lv:1 },
  { id:"ron-004", cat:"論理", sub:"順序関係", q:"A〜Eの5人が徒競走をした。AはBより先、CはDより先、BはCより先、EはAより先にゴールした。3位は誰か。", o:["A","B","C","D"], a:1, e:"E > A > B > C > D の順。3位はBです。", lv:2 },
  { id:"ron-005", cat:"論理", sub:"集合・ベン図", q:"40人のクラスで、英語の合格者は28人、数学の合格者は25人、両方合格した者は18人だった。どちらも不合格だった者は何人か。", o:["3人","5人","7人","9人"], a:1, e:"少なくとも一方に合格したのは28+25−18＝35人。40−35＝5人。", t:"ベン図を書き、重なりを一度だけ引く（包除原理）。", lv:2 },
  { id:"ron-006", cat:"論理", sub:"順序関係", q:"A、B、C、Dの身長について、AはBより高く、CはAより高く、DはBより低い。最も背が高いのは誰か。", o:["A","B","C","D"], a:2, e:"C > A > B > D と一列に確定します。", t:"順序問題は不等号を一本の列に並べ直す。", lv:1 },
  { id:"ron-007", cat:"論理", sub:"集合・ベン図", q:"あるクラスで犬を飼う人は15人、猫を飼う人は12人、両方飼う人は6人、どちらも飼っていない人は9人だった。クラスの人数は何人か。", o:["27人","30人","33人","36人"], a:1, e:"少なくとも一方は15+12−6＝21人。21+9＝30人。", lv:1 },
  { id:"ron-008", cat:"論理", sub:"命題・対偶", q:"「四角形が正方形であること」は、「四角形が長方形であること」の何にあたるか。", o:["必要条件","十分条件","必要十分条件","いずれでもない"], a:1, e:"正方形ならば必ず長方形ですが、逆は成り立ちません。したがって十分条件です。", t:"「PならばQ」のとき、Pが十分条件、Qが必要条件。", lv:2 },
  { id:"ron-009", cat:"論理", sub:"三段論法", q:"「すべての税理士は国家資格者である」「ある国家資格者は公務員である」がともに真であるとき、確実にいえることはどれか。", o:["ある税理士は公務員である","すべての公務員は国家資格者である","税理士でない国家資格者がいる","確実にいえることはない"], a:3, e:"公務員である国家資格者が税理士とは限らず、両者を結ぶ根拠がありません。", t:"「ある」を含む前提から強い結論は導けない。", lv:3 },
  { id:"ron-010", cat:"論理", sub:"試合・リーグ戦", q:"4チームが総当たり戦（各チームが他のすべてと1回ずつ対戦）を行うとき、試合数は何試合か。", o:["4試合","6試合","8試合","12試合"], a:1, e:"4チームから2チームを選ぶ組合せ。4×3÷2＝6試合。", t:"総当たりは n(n−1)÷2。リーグ戦の問題で頻出。", lv:1 },
  { id:"ron-011", cat:"論理", sub:"暦算・曜日", q:"ある年の8月11日は火曜日だった。その日から数えて100日後は何曜日か。", o:["水曜日","木曜日","金曜日","土曜日"], a:1, e:"100÷7＝14あまり2。火曜日の2日後で木曜日。", t:"曜日算は7で割った余りだけ進める。", lv:2 },
  { id:"ron-012", cat:"論理", sub:"対応関係", q:"3人が赤・青・黄のいずれか異なる色の服を着ている。「赤の人は田中ではない」「佐藤は青ではない」「鈴木は赤である」とき、青を着ているのは誰か。", o:["田中","佐藤","鈴木","確定できない"], a:0, e:"鈴木が赤。佐藤は青ではなく赤も不可なので黄。残る青は田中です。", t:"対応関係は表を書いて×を埋めていくのが確実。", lv:2 },

  { id:"ron-013", cat:"論理", sub:"命題・対偶", q:"「PならばQ」の対偶として正しいものはどれか。", o:["QでないならPでない","QならばP","PでないならQでない","QでないならPである"], a:0, e:"対偶は仮定と結論を入れ替えて否定する。「P→Q」の対偶は「¬Q→¬P」です。", t:"逆・裏・対偶を混同しない。逆と裏は必ずしも真ではない。", lv:1 },
  { id:"ron-014", cat:"論理", sub:"命題・対偶", q:"「すべての正社員は社会保険に加入している」が真であるとき、確実に正しいものはどれか。", o:["社会保険に加入している人は全員正社員である","正社員でなければ社会保険に加入できない","社会保険に未加入なら正社員ではない","正社員の多くは社会保険に加入していない"], a:2, e:"「すべてのAはB」の対偶は「BでないならAでない」。他は逆または裏、または無関係な内容です。", lv:2 },
  { id:"ron-015", cat:"論理", sub:"命題・対偶", q:"「nが6の倍数である」ことは、「nが3の倍数である」ことの何条件にあたるか。", o:["必要条件","必要十分条件","いずれでもない","十分条件"], a:3, e:"6の倍数は必ず3の倍数だが、3の倍数が必ず6の倍数とは限らない。よって十分条件です。", lv:2 },
  { id:"ron-016", cat:"論理", sub:"命題・対偶", q:"「AならばB」「BならばC」がともに真であるとき、確実に正しいものはどれか。", o:["AならばCである","CならばAである","AでないならCでない","BでないならAである"], a:0, e:"A→B→Cとつながっているので、A→Cが成り立ちます（推移律）。他は逆や裏で確実とはいえません。", lv:1 },
  { id:"ron-017", cat:"論理", sub:"命題・対偶", q:"「雨が降らず、かつ風も吹かない」の否定として正しいものはどれか。", o:["雨が降り、かつ風が吹く","雨も風もない","雨が降るか、または風が吹く","雨が降らないか、または風が吹かない"], a:2, e:"「AでなくBでもない」の否定は「AまたはB」（ド・モルガンの法則）。かつ⇔または、否定⇔肯定が入れ替わります。", t:"「かつ」の否定は「または」になる。逆にしないよう注意。", lv:3 },
  { id:"ron-018", cat:"論理", sub:"命題・対偶", q:"「合格者は全員18歳以上である」と論理的に同じ意味になるものはどれか。", o:["18歳以上は全員合格者である","18歳未満の合格者もいる","合格者でない人は18歳未満である","18歳未満なら合格者ではない"], a:3, e:"「合格者→18歳以上」の対偶は「18歳未満→合格者でない」。論理的に同じ意味になるのは対偶のみです。", lv:2 },

  { id:"ron-019", cat:"論理", sub:"三段論法", q:"「すべての鳥は卵を産む」「すべてのペンギンは鳥である」がともに真であるとき、確実にいえることはどれか。", o:["すべての卵を産む生き物はペンギンである","すべてのペンギンは卵を産む","卵を産まない生き物はペンギンではない鳥である","ペンギン以外の鳥は卵を産まない"], a:1, e:"ペンギン→鳥→卵を産む、と連鎖するので「すべてのペンギンは卵を産む」が確実にいえます。", lv:1 },
  { id:"ron-020", cat:"論理", sub:"三段論法", q:"「すべての土木職員は現場を担当する」「すべての現場担当者は安全講習を受けている」がともに真であるとき、確実にいえることはどれか。", o:["土木職員は全員安全講習を受けている","安全講習を受けた人は全員土木職員である","現場を担当しない職員は安全講習を受けていない","安全講習を受けていない土木職員もいる"], a:0, e:"土木職員→現場担当→安全講習、と連鎖するため、土木職員は全員安全講習を受けていることになります。", lv:1 },
  { id:"ron-021", cat:"論理", sub:"三段論法", q:"「すべての公務員は住民のために働く」「田中さんは公務員である」がともに真であるとき、確実にいえることはどれか。", o:["田中さんは住民である","住民のために働く人は田中さんだけである","田中さんは住民のために働く","田中さんは公務員ではない"], a:2, e:"すべての公務員は住民のために働き、田中さんは公務員なので、田中さんも住民のために働くことになります。", lv:1 },
  { id:"ron-022", cat:"論理", sub:"三段論法", q:"「すべてのAはBである」「あるCはBである」がともに真であるとき、確実にいえることはどれか。", o:["あるAはCである","すべてのCはAである","あるBはAでない","確実にいえることはない"], a:3, e:"BはAとCに共通するが、AとCを結びつける根拠はない。中間項(B)の使われ方が食い違い、結論は導けません。", t:"中間項が両方とも「ある」や食い違う場合は結論を保留する。", lv:3 },
  { id:"ron-023", cat:"論理", sub:"三段論法", q:"「すべての看護師は医療従事者である」「ある職員は看護師である」がともに真であるとき、確実にいえることはどれか。", o:["ある職員は医療従事者である","すべての職員は医療従事者である","医療従事者でない職員はいない","看護師でない職員は医療従事者ではない"], a:0, e:"「あるCはA」かつ「すべてのAはB」なら「あるCはB」は確実にいえます。「すべて」に広げるのは誤りです。", lv:2 },
  { id:"ron-024", cat:"論理", sub:"三段論法", q:"「すべての受験者は申込書を提出した」「山田さんは申込書を提出していない」がともに真であるとき、確実にいえることはどれか。", o:["山田さんは受験者である","申込書を提出した人は全員受験者である","山田さんは受験者ではない","山田さんは以前は受験者だった"], a:2, e:"受験者→提出という関係があるので、提出していない山田さんは受験者ではないと確実にいえます（対偶的な推論）。", lv:2 },
  { id:"ron-025", cat:"論理", sub:"三段論法", q:"「あるA社員は資格を持つ」「ある資格保持者は管理職である」がともに真であるとき、確実にいえることはどれか。", o:["あるA社員は管理職である","すべてのA社員は管理職である","資格を持たない人は管理職ではない","確実にいえることはない"], a:3, e:"『あるA社員は資格保持者』と『ある資格保持者は管理職』はそれぞれ一部を指すだけで、同一人物とは限りません。", t:"「ある」と「ある」を組み合わせても確実な結論にはならない。", lv:3 },

  { id:"ron-026", cat:"論理", sub:"集合・ベン図", q:"あるアンケートで、コーヒーが好きな人は32人、紅茶が好きな人は24人、両方好きな人は14人だった。少なくとも一方が好きな人は何人か。", o:["38人","42人","46人","56人"], a:1, e:"少なくとも一方＝コーヒー+紅茶−両方＝32+24−14＝42人（包除原理）。", lv:1 },
  { id:"ron-027", cat:"論理", sub:"集合・ベン図", q:"50人の学生のうち、数学が得意な人は30人、理科が得意な人は22人、どちらも得意でない人は10人だった。両方得意な人は何人か。", o:["12人","2人","22人","32人"], a:0, e:"少なくとも一方＝50−10＝40人。両方＝30+22−40＝12人。", t:"「どちらも～ない」を先に引いて「少なくとも一方」を出すのがコツ。", lv:2 },
  { id:"ron-028", cat:"論理", sub:"集合・ベン図", q:"ある職場で、資格Xを持つ人は18人、資格Yを持つ人は15人、どちらも持たない人は7人、職場の人数は30人だった。資格Xのみを持つ人は何人か。", o:["6人","7人","8人","10人"], a:2, e:"両方保持者＝18+15−(30−7)＝10人。Xのみ＝18−10＝8人。", lv:2 },
  { id:"ron-029", cat:"論理", sub:"集合・ベン図", q:"生徒40人に旅行先の希望を聞いたところ、海が好きな人は26人、山が好きな人は21人だった。どちらも好きでない人がいないとすると、両方好きな人は何人か。", o:["5人","6人","9人","7人"], a:3, e:"全員が海か山のどちらかを好きなので、少なくとも一方＝40人。両方＝26+21−40＝7人。", lv:2 },
  { id:"ron-030", cat:"論理", sub:"集合・ベン図", q:"ある会員制施設で、映画好きは45人、音楽好きは38人、両方好きな人は20人だった。どちらか一方だけが好きな人は何人か。", o:["43人","63人","83人","40人"], a:0, e:"一方だけ＝(映画のみ)+(音楽のみ)＝(45−20)+(38−20)＝25+18＝43人。", t:"「一方だけ」は重なり分を2回引くのがコツ。", lv:3 },
  { id:"ron-031", cat:"論理", sub:"集合・ベン図", q:"35人のクラスで、部活動Aに入っている人は19人、部活動Bに入っている人は14人、両方に入っている人は6人だった。どちらの部活動にも入っていない人は何人か。", o:["6人","10人","8人","12人"], a:2, e:"少なくとも一方＝19+14−6＝27人。どちらにも入っていない人＝35−27＝8人。", lv:1 },

  { id:"ron-032", cat:"論理", sub:"順序関係", q:"P、Q、R、Sの4人でテストの得点を比べたところ、PはQより高く、RはPより高く、SはQより低かった。得点が2番目に高いのは誰か。", o:["Q","R","S","P"], a:3, e:"R>P>Q>S の順に確定します。2番目に高いのはPです。", lv:1 },
  { id:"ron-033", cat:"論理", sub:"順序関係", q:"5人の走者A〜Eがゴールした順位について、EはAより先、AはCより先、CはBより先、DはEより先にゴールした。最下位は誰か。", o:["D","B","A","C"], a:1, e:"D>E>A>C>B の順に確定します。最下位はBです。", lv:2 },
  { id:"ron-034", cat:"論理", sub:"順序関係", q:"4つの荷物W、X、Y、Zの重さを比べると、WはXより重く、XはYより重く、ZはWより重かった。最も軽いのはどれか。", o:["Y","W","X","Z"], a:0, e:"Z>W>X>Y の順に確定します。最も軽いのはYです。", lv:1 },
  { id:"ron-035", cat:"論理", sub:"順序関係", q:"5人の職員F〜Jの出勤時刻を比べると、FはGより早く、HはFより早く、IはHより早く、JはGより遅かった。2番目に早く出勤したのは誰か。", o:["I","F","H","G"], a:2, e:"I>H>F>G>J の順に確定します。2番目に早いのはHです。", lv:2 },
  { id:"ron-036", cat:"論理", sub:"順序関係", q:"A、B、C、Dの年齢について、AはBより3歳年上、CはAより2歳年下、DはCより5歳年上である。最も年上なのは誰か。", o:["A","C","B","D"], a:3, e:"Bの年齢をxとすると、A=x+3、C=x+1、D=x+6。比べるとD>A>C>Bとなり、最も年上はDです。", t:"文字で年齢を置き、差を足し引きして比べると確実。", lv:2 },

  { id:"ron-037", cat:"論理", sub:"対応関係", q:"A、B、Cの3人が、それぞれ異なる部署（総務・財政・土木）に配属されている。「Aは総務ではない」「Bは土木である」「Cは財政ではない」とき、Aの配属先はどこか。", o:["財政","総務","土木","教育"], a:0, e:"Bは土木で確定。Aは総務でないので財政、残るCが総務となります。", lv:1 },
  { id:"ron-038", cat:"論理", sub:"対応関係", q:"P、Q、Rの3人がそれぞれ異なるスポーツ（野球・サッカー・テニス）を担当する。Pはテニスでもサッカーでもなく、Rはサッカーではない。Qの担当は何か。", o:["野球","テニス","サッカー","バスケットボール"], a:2, e:"Pはテニスでもサッカーでもないので野球。Rはサッカーでないのでテニス。残るQがサッカーとなります。", lv:2 },
  { id:"ron-039", cat:"論理", sub:"対応関係", q:"A〜Dの4人がそれぞれ異なる階（1階〜4階）の窓口を担当している。「Aは1階ではない」「Bは3階である」「Cは4階ではない」「Dは2階でも4階でもない」とき、Aの階は何階か。", o:["1階","2階","3階","4階"], a:3, e:"Bは3階で確定。Dは2階でも4階でもないので1階。Cは4階でないので2階。残るAが4階となります。", lv:2 },
  { id:"ron-040", cat:"論理", sub:"対応関係", q:"3人が異なる飲み物（コーヒー・紅茶・ジュース）を注文した。「田中はコーヒーを注文していない」「鈴木は紅茶を注文した」「佐藤はジュースを注文していない」とき、田中の注文は何か。", o:["紅茶","ジュース","コーヒー","水"], a:1, e:"鈴木は紅茶で確定。田中はコーヒーでないのでジュース、残る佐藤がコーヒーとなります。", lv:2 },
  { id:"ron-041", cat:"論理", sub:"対応関係", q:"A〜Dの4人が、異なる動物（犬・猫・鳥・魚）をそれぞれ1匹だけ飼っている。「Aは犬を飼っていない」「Bは猫を飼っている」「Cは鳥も魚も飼っていない」「Dは魚を飼っていない」とき、Aが飼っている動物は何か。", o:["魚","犬","猫","鳥"], a:0, e:"Bは猫で確定。Cは鳥も魚も飼っていないので犬。Dは魚でないので鳥。残るAが魚となります。", lv:2 },
  { id:"ron-042", cat:"論理", sub:"対応関係", q:"E、F、Gの3人がそれぞれ異なる資格（宅建・簿記・行政書士）を持っている。Eは宅建でも簿記でもなく、Gは簿記を持っていない。Fの資格は何か。", o:["宅建","行政書士","簿記","司法書士"], a:2, e:"Eは宅建でも簿記でもないので行政書士。Gは簿記でないので宅建。残るFが簿記となります。", lv:1 },

  { id:"ron-043", cat:"論理", sub:"位置・席順", q:"A〜Dの4人が横一列に並んでいる。一番左はDで、Aの右隣はC、Bは一番右ではない。左から3番目は誰か。", o:["B","C","D","A"], a:3, e:"Dが1番目。AとCは隣り合うので、残る2〜4番目のうちA=3,C=4しか成立せず（Bが4番目だと条件違反）、Aが3番目になります。", t:"隣接条件はまず候補パターンを絞り、他の条件で1つに確定させる。", lv:3 },
  { id:"ron-044", cat:"論理", sub:"位置・席順", q:"E、F、G、Hの4人が円卓に等間隔で座っている。EとGは向かい合っている。Fの向かいに座っているのは誰か。", o:["H","E","F","G"], a:0, e:"円卓の4人は必ず2組の「向かい合う」ペアに分かれます。EとGが1組なので、残るFとHがもう1組。Fの向かいはHです。", t:"4人の円卓では、向かい合う組は自動的に2組に決まる。", lv:2 },
  { id:"ron-045", cat:"論理", sub:"位置・席順", q:"5人の子どもI〜Mが横一列のベンチに座っている。Iは真ん中（3番目）、JはIのすぐ左、KはMのすぐ右、Lは端に座っている。Jの位置は左から何番目か。", o:["1番目","5番目","2番目","4番目"], a:2, e:"Iが3番目、Jはそのすぐ左なので2番目。残るK・L・Mは、KがMのすぐ右になるのはM=4,K=5のときだけで、Lは自動的に1番目になります。", lv:2 },
  { id:"ron-046", cat:"論理", sub:"位置・席順", q:"N〜Qの4人が4階建てマンションの各階（1〜4階）に1人ずつ住んでいる。NはQより上の階に住み、OはNのすぐ下の階、Pは1階に住んでいる。Qは何階か。", o:["1階","3階","4階","2階"], a:3, e:"Pは1階。残る2〜4階のうち「OはNのすぐ下」かつ「NはQより上」を両方満たすのはN=4,O=3,Q=2だけです。", lv:2 },
  { id:"ron-047", cat:"論理", sub:"位置・席順", q:"R〜Uの4人の机が横一列に並んでいる。Rは一番左、Sは一番右、Tより左にUがいる。Tの位置は左から何番目か。", o:["2番目","3番目","1番目","4番目"], a:1, e:"Rが1番目、Sが4番目で固定。残る2・3番目にT・Uが入りますが、Uの方が左なのでU=2番目、T=3番目に決まります。", lv:1 },
  { id:"ron-048", cat:"論理", sub:"位置・席順", q:"Ee〜Iiの5人がレジに1列に並んでいる。Eeは先頭、Iiは最後尾である。FfはGgのすぐ後ろに並び、HhはFfより前に並んでいる。Hhは先頭から何番目か。", o:["2番目","3番目","4番目","5番目"], a:0, e:"Eeが1番目、Iiが5番目で固定。「FfはGgのすぐ後ろ」かつ「HhはFfより前」を満たすのはGg=3,Ff=4,Hh=2だけです。", lv:3 },
  { id:"ron-049", cat:"論理", sub:"位置・席順", q:"Jj〜Nnの5人が横一列に並んでいる。Jjは一番左で、JjとNnの間には2人いる。Nnは左から何番目か。", o:["3番目","5番目","4番目","2番目"], a:2, e:"Jjは1番目に固定。「間に2人」とは2人分の間隔があるという意味なので、Nnは1+2+1＝4番目です。", t:"「間に○人」は、間隔の人数+2（両端）を数えるのがコツ。", lv:2 },
  { id:"ron-050", cat:"論理", sub:"位置・席順", q:"Oo〜Rrの4人が横一列に並んでいる。OoとPpは隣り合っている。QqはOoの隣ではない。Rrは一番左である。Ppは左から何番目か。", o:["2番目","1番目","4番目","3番目"], a:3, e:"Rrは1番目で固定。条件を満たす並びはOo・Qqの位置で2通りあり得ますが、どちらの場合もPpは3番目に決まります。", t:"聞かれている人の位置だけが常に同じなら、他が複数通りでも答えは一意に決まる。", lv:3 },
{ id:"ron-051", cat:"論理", sub:"規則性・法則", q:"A,D,G,J,M,? 次にくる文字はどれか。", o:["P","Q","O","N"], a:0, e:"3文字ずつ先に進む規則(A→D→G…は+3)。Mの次は+3でP。", lv:1 },
  { id:"ron-052", cat:"論理", sub:"規則性・法則", q:"○●●の3個1組を繰り返す並びで、50番目の記号は?", o:["○","●","△","□"], a:1, e:"50÷3=16あまり2。1番目○,2番目●,3番目●なので、あまり2番目の●。", t:"「何番目÷周期の長さ」のあまりで考える。", lv:2 },
  { id:"ron-053", cat:"論理", sub:"規則性・法則", q:"あ,か,さ,た,な,? 五十音の行の最初の文字の並び。", o:["ま","や","は","ら"], a:2, e:"あ行→か行→さ行→た行→な行と1行ずつ進む。次はは行で「は」。", lv:1 },
  { id:"ron-054", cat:"論理", sub:"規則性・法則", q:"121,144,169,150のうち、仲間はずれはどれか。", o:["121","144","169","150"], a:3, e:"121=11²,144=12²,169=13²でどれも平方数。150だけ平方数でない。", lv:2 },
  { id:"ron-055", cat:"論理", sub:"規則性・法則", q:"21,35,42,50のうち、仲間はずれはどれか。", o:["50","21","35","42"], a:0, e:"21,35,42は7の倍数(7×3,7×5,7×6)。50は7で割り切れない。", lv:2 },
  { id:"ron-056", cat:"論理", sub:"規則性・法則", q:"12,21,34,43,56,? 次にくる数はどれか。", o:["66","65","76","58"], a:1, e:"元の数と逆順の数を交互に並べ、元の数は12→34→56と22ずつ増える。56の逆順は65。", t:"「元の数」と「ひっくり返した数」が交互に来ることに注目。", lv:3 },
  { id:"ron-057", cat:"論理", sub:"規則性・法則", q:"すいか,みかん,いちご,パイナップルのうち仲間はずれは?", o:["すいか","みかん","パイナップル","いちご"], a:2, e:"すいか・みかん・いちごはひらがな3文字。パイナップルだけ6文字で仲間はずれ。", lv:1 },
  { id:"ron-058", cat:"論理", sub:"規則性・法則", q:"12,54,89,37のうち、逆順にすると差が最も大きい数は?", o:["12","54","89","37"], a:3, e:"12→21(+9),54→45(-9),89→98(+9),37→73(+36)。37が最大。", lv:2 },
  { id:"ron-059", cat:"論理", sub:"暗号", q:"あ=11,い=12,か=21,き=22の規則で「32」が表す文字は?", o:["し","す","に","ち"], a:0, e:"十の位が行(1=あ,2=か,3=さ…)、一の位が段。32はさ行の2番目「し」。", t:"十の位=行、一の位=段と分けて考える。", lv:2 },
  { id:"ron-060", cat:"論理", sub:"暗号", q:"A=1,B=2…Z=26のとき「3-15-4-5」が表す単語は?", o:["DOME","CODE","BOSE","COLD"], a:1, e:"3=C,15=O,4=D,5=Eなので「CODE」。", lv:1 },
  { id:"ron-061", cat:"論理", sub:"暗号", q:"ひらがなを逆から並べる暗号で「らくさ」が表す言葉は?", o:["くらさ","らさく","さくら","くさら"], a:2, e:"「らくさ」を逆から読むと「さくら」。", lv:2 },
  { id:"ron-062", cat:"論理", sub:"暗号", q:"50音順で1つ後にずらす暗号(あ→い,め→も)。「さくら」を暗号化すると?", o:["すきる","しきる","せくり","しけり"], a:3, e:"さ→し,く→け,ら→りと1音ずつ後ろへずらすと「しけり」。", t:"行の中の並び(か・き・く・け・こ)で1つ後ろを考える。", lv:2 },
  { id:"ron-063", cat:"論理", sub:"暗号", q:"A=Z,B=Y,C=X…と逆に対応させる暗号で「DOG」は?", o:["WLT","XLT","WMT","VLT"], a:0, e:"D↔W,O↔L,G↔T(1番目と26番目、2番目と25番目…が対応)。", lv:1 },
  { id:"ron-064", cat:"論理", sub:"暗号", q:"各数字に+3(0-9は循環)した暗号「7025」の元の数字は?", o:["4082","4792","7025","1462"], a:1, e:"逆に-3する。7-3=4,0-3=7,2-3=9,5-3=2で「4792」。検算:4792に+3すると7025。", t:"0-3=7のように繰り下がり(mod10)に注意。", lv:3 },
  { id:"ron-065", cat:"論理", sub:"ブラックボックス", q:"装置は3→10,5→16,8→25と変換する。7を入れると?", o:["21","20","22","23"], a:2, e:"規則は「3倍して1を足す」(3×3+1=10等)。7×3+1=22。", lv:1 },
  { id:"ron-066", cat:"論理", sub:"ブラックボックス", q:"装置は「入力を2倍して5を足す」。出力が17のとき入力は?", o:["7","5","8","6"], a:3, e:"逆算する。17-5=12、12÷2=6。検算:6×2+5=17。", lv:2 },
  { id:"ron-067", cat:"論理", sub:"ブラックボックス", q:"装置は10→3,16→6,22→9と変換する。18を入れると?", o:["7","8","6","9"], a:0, e:"規則は「2で割って2を引く」(10÷2-2=3等)。18÷2-2=7。", lv:1 },
  { id:"ron-068", cat:"論理", sub:"ブラックボックス", q:"装置Aは「3を足す」、Bは「2倍する」。A→Bの順に通すと22。元の数は?", o:["9","8","7","10"], a:1, e:"逆にたどる。22÷2=11(Bの前)、11-3=8(Aの前)。", t:"逆算は装置を通した逆順でたどる。", lv:2 },
  { id:"ron-069", cat:"論理", sub:"ブラックボックス", q:"装置は20→7,26→10,14→4と変換する。30を入れると?", o:["11","10","12","13"], a:2, e:"規則は「6を引いて2で割る」((20-6)÷2=7等)。(30-6)÷2=12。", lv:2 },
  { id:"ron-070", cat:"論理", sub:"ブラックボックス", q:"装置は「3倍してから4を引く」。出力が17のとき入力は?", o:["8","9","6","7"], a:3, e:"逆算する。17+4=21、21÷3=7。検算:7×3-4=17。", t:"逆算は「+4してから÷3」のように演算を逆順・逆符号で行う。", lv:2 },
  { id:"ron-071", cat:"論理", sub:"空間把握・展開図", q:"サイコロは向かい合う面の和が7。1の向かいが6、2の向かいが5のとき3の向かいは?", o:["4","5","2","6"], a:0, e:"向かい合う面の和は常に7。7-3=4。", lv:1 },
  { id:"ron-072", cat:"論理", sub:"空間把握・展開図", q:"正方形の紙を半分に2回折り、折り目に触れない位置に穴を1つあけて広げると穴は何か所?", o:["2","4","3","8"], a:1, e:"2回折ると4枚重なる。折り目から離れた穴は広げると4か所に対称に現れる。", t:"n回折ると2ⁿ枚重なり、穴の数もその枚数になる。", lv:3 },
  { id:"ron-073", cat:"論理", sub:"空間把握・展開図", q:"サイコロ(向かい合う面の和7)の見えている3面が1,2,3のとき、見えない3面の和は?", o:["18","12","15","9"], a:2, e:"全6面の和は1〜6の合計21。見えている和1+2+3=6を引くと15。", lv:2 },
  { id:"ron-074", cat:"論理", sub:"空間把握・展開図", q:"北を向いて立つAさんが右に90度、続けて左に180度回転。今の向きは?", o:["東","南","北","西"], a:3, e:"北→(右90°)→東→(左180°)→西。", lv:1 },
  { id:"ron-075", cat:"論理", sub:"空間把握・展開図", q:"南を向いて歩くBさんが角で右へ90度、次の角でも右へ90度曲がった。今の向きは?", o:["北","南","東","西"], a:0, e:"南→(右90°)→西→(右90°)→北。", lv:2 },
  { id:"ron-076", cat:"論理", sub:"空間把握・展開図", q:"時計の文字盤を鏡に映すと、実際の時刻が3時のとき鏡の中の時計は何時?", o:["3時","9時","6時","12時"], a:1, e:"鏡映しの時刻は12時を基準に左右対称になる。3時の鏡像は9時。", lv:1 },
  { id:"ron-077", cat:"論理", sub:"空間把握・展開図", q:"上面に☆、正面に○の立方体を手前に1回転がすと、正面は何になる?", o:["○","×","☆","□"], a:2, e:"手前に転がすと元の上面が新しい正面になる。上面の☆が正面へ移る。", lv:2 },
  { id:"ron-078", cat:"論理", sub:"暦算・曜日", q:"ある月の1日が火曜日のとき、その月の23日は何曜日?", o:["木曜日","金曜日","火曜日","水曜日"], a:3, e:"23-1=22日後。22÷7=3あまり1で火曜+1=水曜日。", lv:1 },
  { id:"ron-079", cat:"論理", sub:"暦算・曜日", q:"1月1日が日曜日の年、2月で最初の月曜日は何日?", o:["6日","5日","7日","4日"], a:0, e:"1月は31日。2月1日は日曜+31日後で31÷7=4あまり3、水曜日。水曜から次の月曜は5日後の6日。", lv:2 },
  { id:"ron-080", cat:"論理", sub:"暦算・曜日", q:"4月1日が金曜日の年、5月5日は何曜日?", o:["水曜日","木曜日","金曜日","土曜日"], a:1, e:"4月1日から5月5日までは30+4=34日後。34÷7=4あまり6で金曜+6=木曜日。", t:"月をまたぐ日数計算は、まずその月の日数(4月=30日)を足す。", lv:2 },
  { id:"ron-081", cat:"論理", sub:"暦算・曜日", q:"ある月の第2土曜日が12日のとき、その月の1日は何曜日?", o:["月曜日","水曜日","火曜日","木曜日"], a:2, e:"第2土曜日が12日なら第1土曜日は5日。5日が土曜なので1日は4日前の火曜日。", lv:2 },
  { id:"ron-082", cat:"論理", sub:"暦算・曜日", q:"うるう年でない年の3月1日が木曜日のとき、1月1日は何曜日?", o:["日曜日","火曜日","水曜日","月曜日"], a:3, e:"1月(31日)+2月(28日)=59日後が3月1日。59÷7=8あまり3で、木曜の3日前は月曜日。", t:"うるう年でなければ2月は28日と覚えておく。", lv:3 },
  { id:"ron-083", cat:"論理", sub:"試合・リーグ戦", q:"A〜Eの5チームが総当たり戦を行う。各チームの試合数は?", o:["4試合","5試合","3試合","10試合"], a:0, e:"自分以外の4チームと1回ずつ対戦するので4試合。10試合は全体の試合数。", lv:1 },
  { id:"ron-084", cat:"論理", sub:"試合・リーグ戦", q:"A〜Dの4チームが総当たり戦を行う。全試合数は?", o:["4試合","6試合","8試合","12試合"], a:1, e:"4チームから2チームを選ぶ組み合わせは4×3÷2=6試合。", lv:1 },
  { id:"ron-085", cat:"論理", sub:"試合・リーグ戦", q:"A〜Dの総当たり戦。Aは1勝2敗でCに勝ちBに負けた。Dが3勝0敗のとき、Aが負けたもう1チームは?", o:["B","C","D","引き分け"], a:2, e:"Dは3勝0敗で全チームに勝っているのでAにも勝っている。Aの敗戦はBとDの2つ。", t:"全勝チームは他の全チームに勝っていることを利用する。", lv:2 },
  { id:"ron-086", cat:"論理", sub:"試合・リーグ戦", q:"4チームでトーナメント戦。1回戦A対B、C対D、2回戦は勝者同士。全部で何試合?", o:["2試合","4試合","6試合","3試合"], a:3, e:"1回戦2試合+決勝1試合で合計3試合。", lv:1 },
  { id:"ron-087", cat:"論理", sub:"試合・リーグ戦", q:"8チームの勝ち抜き戦(トーナメント)で優勝を決めるのに必要な試合数は?", o:["7試合","8試合","4試合","3試合"], a:0, e:"1試合ごとに1チームが敗退する。優勝以外の7チームが1回ずつ負けるので7試合。", lv:2 },
  { id:"ron-088", cat:"論理", sub:"試合・リーグ戦", q:"A〜Dの総当たり戦。Aは3戦全勝、Bは2勝1敗、Cは1勝2敗、Dは0勝3敗。Bが負けた相手として確実なのは?", o:["C","A","D","C・Dの両方"], a:1, e:"Aは3戦全勝で全チームに勝っているのでBもAに負けている。Bの敗戦は1つだけなのでそれがAで確定。", t:"全勝・全敗のチームから他の結果を絞り込む。", lv:3 },
  { id:"ron-089", cat:"論理", sub:"真偽・うそつき", q:"AとBの2人がいる。Aが『私たちは2人ともうそつきだ』と言った。Aは正直者かうそつきか。", o:["正直者","2人ともうそつき","うそつき","2人とも正直者"], a:2, e:"Aが正直者なら発言が真実になり自己矛盾。よってAはうそつきで、発言は嘘なのでBは正直者。", lv:2 },
  { id:"ron-090", cat:"論理", sub:"真偽・うそつき", q:"A,B,Cのうち正直者は1人だけ。Aは『Bはうそつきだ』、Bは『Cは正直者だ』。正直者は誰?", o:["B","C","2人とも正直者","A"], a:3, e:"Aが正直者と仮定すると全て矛盾なく成立する。B,Cを正直者とする場合はそれぞれ矛盾が生じる。", t:"3通りの仮定を1つずつ試して矛盾がないか確かめる。", lv:2 },
  { id:"ron-091", cat:"論理", sub:"真偽・うそつき", q:"A,B,Cのうちうそつきは1人だけ。Aは『私は正直者だ』、Bは『Aはうそつきだ』、Cは『Bは正直者だ』。うそつきは誰?", o:["A","B","C","AとB"], a:0, e:"うそつきをAとすると、B・Cの発言も含めすべて矛盾なく成立する唯一の場合になる。", t:"自分自身についての発言(私は正直者だ)は単独では決め手にならない。", lv:3 },
  { id:"ron-092", cat:"論理", sub:"真偽・うそつき", q:"A〜Dの少なくとも1人は正直者。Aは『うそつきは3人』、Bは『1人』、Cは『0人』、Dは『2人』。うそつきは何人?", o:["1人","3人","2人","0人"], a:1, e:"実際の人数と発言が一致する人だけ正直者になれる。うそつき3人ならAだけ正直者で条件と矛盾しない。", t:"「全員うそつき」の可能性は「少なくとも1人正直者」の条件で除外される。", lv:3 },
  { id:"ron-093", cat:"論理", sub:"真偽・うそつき", q:"AとBは独立に正直者かうそつき。Aが『少なくとも一方はうそつきだ』と言った。A,Bはそれぞれどちら?", o:["Aはうそつき・Bは正直者","2人とも正直者","Aは正直者・Bはうそつき","2人ともうそつき"], a:2, e:"Aが正直者なら発言通りBがうそつきで矛盾なし。Aがうそつきだと発言が偽になり2人とも正直者となり自己矛盾。", lv:2 },
  { id:"ron-094", cat:"論理", sub:"真偽・うそつき", q:"A,B,Cのうちうそつきは1人だけ。Aは『Cは正直者だ』、Cは『Bはうそつきだ』。うそつきは誰?", o:["A","C","AとC","B"], a:3, e:"うそつきをBとすると、正直者のAとCの発言がどちらも真実になり矛盾しない。A,Cをうそつきとすると矛盾が生じる。", lv:3 },
  { id:"ron-095", cat:"論理", sub:"真偽・うそつき", q:"XとYが互いに『相手はうそつきだ』と言った。この2つの発言から確実に言えることは?", o:["Xが正直者である","Yが正直者である","1人が正直者でもう1人がうそつき","2人とも正直者である"], a:2, e:"2人とも正直者/2人ともうそつきはどちらも自己矛盾になり成立しない。どちらか一方だけが正直者と確定する。", t:"「誰が」までは決まらなくても「組み合わせ」は確定できる場合がある。", lv:2 },
// ── 既存「数理」12問（scoa-jissen-drill.html より q/o/a/e/t を変更せず取り込み） ──
 { id:"suri-001", cat:"数理", sub:"割合・比", q:"定価の2割引で買ったところ、代金は1,760円だった。定価はいくらか。", o:["2,000円","2,112円","2,200円","2,400円"], a:2, e:"2割引＝定価の0.8倍。1,760÷0.8＝2,200円。", t:"割引後の額から戻すときは掛けずに割る。", lv:1 },
 { id:"suri-002", cat:"数理", sub:"損益算", q:"原価1,000円の品物に定価をつけ、定価の2割引で売っても原価の2割の利益が出るようにしたい。定価はいくらか。", o:["1,400円","1,440円","1,500円","1,600円"], a:2, e:"売価は1,000×1.2＝1,200円。定価をdとすると0.8d＝1,200、d＝1,500円。", t:"損益算は「原価→定価→売価」の3段構えで整理する。", lv:2 },
 { id:"suri-003", cat:"数理", sub:"四則計算・逆算", q:"次の計算の答えはどれか。", s:"12 × 25 − 180 ÷ 6", o:["270","250","320","180"], a:0, e:"乗除が先。12×25＝300、180÷6＝30。300−30＝270。", t:"12×25は「12×100÷4」と考えると速い。", lv:1 },
 { id:"suri-004", cat:"数理", sub:"四則計算・逆算", q:"現在、父は42歳、子は12歳である。父の年齢が子の年齢のちょうど2倍になるのは何年後か。", o:["12年後","15年後","18年後","20年後"], a:2, e:"x年後として42+x＝2(12+x)。42+x＝24+2xよりx＝18。18年後に60歳と30歳。", lv:2 },
 { id:"suri-005", cat:"数理", sub:"濃度算", q:"8%の食塩水200gに水を加えて5%にしたい。加える水は何gか。", o:["80g","100g","120g","150g"], a:2, e:"食塩は200×0.08＝16gで不変。5%にするには全体320g必要。320−200＝120g。", t:"濃度算は「食塩の量は変わらない」を軸に立式する。", lv:2 },
 { id:"suri-006", cat:"数理", sub:"速さ・距離・時間", q:"全長6kmの道のりを、はじめ時速4kmで歩き、途中から時速12kmで走ったところ、ちょうど1時間かかった。走った距離は何kmか。", o:["2km","3km","4km","4.5km"], a:1, e:"歩きx、走りyとして x+y＝6、x/4+y/12＝1。後式を12倍して3x+y＝12。差から2x＝6、x＝3、y＝3。", t:"速さの文章題は「距離の式」と「時間の式」の連立が定石。", lv:2 },
 { id:"suri-007", cat:"数理", sub:"割合・比", q:"2個のさいころを同時に投げたとき、出た目の和が7になる確率はどれか。", o:["1/12","1/9","1/6","1/4"], a:2, e:"全36通りのうち和が7は6通り。6/36＝1/6。", t:"2個のさいころでは和7が最も出やすい、と覚えておくと速い。", lv:1 },
 { id:"suri-008", cat:"数理", sub:"四則計算・逆算", q:"次の数列の□に入る数はどれか。", s:"2, 5, 11, 23, 47, □", o:["71","83","95","99"], a:2, e:"直前の数を2倍して1を足す規則。47×2+1＝95。", t:"差が3,6,12,24と倍々になっている点からも導けます。", lv:2 },
 { id:"suri-009", cat:"数理", sub:"平均・過不足", q:"5科目のテストの平均点が72点だった。6科目目で平均を75点にするには、何点取ればよいか。", o:["81点","85点","87点","90点"], a:3, e:"6科目で平均75点なら合計450点。現在の合計は72×5＝360点。450−360＝90点。", t:"平均の問題は必ず合計に直してから処理する。", lv:1 },
 { id:"suri-010", cat:"数理", sub:"割合・比", q:"ある店の売上が、前月比で1月は20%増、2月は20%減となった。2月の売上は前年12月と比べてどうか。", o:["変わらない","4%増","4%減","8%減"], a:2, e:"1.2×0.8＝0.96。4%減です。", t:"「同率の増減は元に戻らない」は頻出のひっかけ。", lv:2 },
 { id:"suri-011", cat:"数理", sub:"四則計算・逆算", q:"1辺10cmの正方形に内接する円の面積はいくらか。円周率は3.14とする。", o:["31.4cm²","62.8cm²","78.5cm²","314cm²"], a:2, e:"内接円の半径は5cm。5×5×3.14＝78.5cm²。", t:"内接＝直径が1辺と等しい。外接と取り違えないこと。", lv:1 },
 { id:"suri-012", cat:"数理", sub:"仕事算", q:"ある仕事をAは6日、Bは12日で終える。2人で同時に行うと何日で終わるか。", o:["3日","4日","5日","9日"], a:1, e:"1日あたりA＝1/6、B＝1/12、合計1/4。1÷(1/4)＝4日。", t:"仕事算は全体を1、または最小公倍数（この場合12）と置く。", lv:1 },

 // ── 新規38問 ──
 { id:"suri-013", cat:"数理", sub:"四則計算・逆算", q:"次の計算の答えはどれか。", s:"48 ÷ 6 + 7 × 5", o:["41","48","75","43"], a:3, e:"わり算とかけ算が先。48÷6＝8、7×5＝35。8+35＝43。", lv:1 },
 { id:"suri-014", cat:"数理", sub:"四則計算・逆算", q:"次の計算の答えはどれか。", s:"9 × 8 − 96 ÷ 4", o:["48","44","56","40"], a:0, e:"かけ算・わり算が先。9×8＝72、96÷4＝24。72−24＝48。", lv:1 },
 { id:"suri-015", cat:"数理", sub:"四則計算・逆算", q:"ある数を5で割るところを誤って5を掛けてしまい、答えが150になった。正しい計算の答えはいくらか。", o:["30","6","25","750"], a:1, e:"誤った計算から元の数は150÷5＝30。正しくは30を5で割るので30÷5＝6。", t:"先に誤答から元の数を逆算し、それから正しい計算をやり直す。", lv:2 },
 { id:"suri-016", cat:"数理", sub:"四則計算・逆算", q:"ある数に7を足して3倍したところ48になった。ある数はいくらか。", o:["5","12","16","9"], a:3, e:"(x+7)×3＝48より x+7＝16、x＝9。", lv:2 },
 { id:"suri-017", cat:"数理", sub:"割合・比", q:"40人のクラスで男子が24人のとき、男子の割合は全体の何%か。", o:["60%","64%","40%","65%"], a:0, e:"24÷40＝0.6。男子の割合は60%。", lv:1 },
 { id:"suri-018", cat:"数理", sub:"割合・比", q:"A:B＝3:5、B:C＝2:3のとき、A:B:Cを最も簡単な整数比で表すとどれか。", o:["3:5:3","6:10:15","6:10:9","9:15:20"], a:1, e:"Bを5と2の最小公倍数10にそろえると、A:B＝6:10、B:C＝10:15。よってA:B:C＝6:10:15。", t:"共通の項の値をそろえてから結合するのが比の合成のコツ。", lv:2 },
 { id:"suri-019", cat:"数理", sub:"割合・比", q:"水槽の水は満水時の5分の2である。あと84Lで満水になるとき、満水時の容量は何Lか。", o:["84L","126L","210L","140L"], a:3, e:"残り3/5が84Lなので、満水量は84÷(3/5)＝84×5/3＝140L。", t:"「あと◯Lで満水」は割合の余り部分に注目する。", lv:2 },
 { id:"suri-020", cat:"数理", sub:"割合・比", q:"1,200円を兄と弟で5:3の比に分けるとき、弟の金額はいくらか。", o:["450円","750円","400円","600円"], a:0, e:"全体を8等分し、弟は3/8。1,200×3/8＝450円。", lv:2 },
 { id:"suri-021", cat:"数理", sub:"割合・比", q:"商品Aの売上は商品Bの1.5倍で、AとBの売上の合計は250万円である。Bの売上はいくらか。", o:["150万円","100万円","125万円","83万円"], a:1, e:"Bをxとすると A＝1.5x。x+1.5x＝2.5x＝250万円よりx＝100万円。", lv:3 },
 { id:"suri-022", cat:"数理", sub:"損益算", q:"原価800円の品物に3割の利益を見込んで定価をつけた。定価はいくらか。", o:["1,024円","1,100円","1,040円","800円"], a:2, e:"定価＝原価×(1+利益率)＝800×1.3＝1,040円。", lv:1 },
 { id:"suri-023", cat:"数理", sub:"損益算", q:"定価2,750円の商品を2割引で売ったところ、原価の1割の利益があった。原価はいくらか。", o:["2,200円","2,500円","2,475円","2,000円"], a:3, e:"売価は2,750×0.8＝2,200円。原価をxとすると1.1x＝2,200よりx＝2,000円。", lv:2 },
 { id:"suri-024", cat:"数理", sub:"損益算", q:"原価の4割増しの定価をつけたが売れず、定価の1割引で売った。原価に対する利益率はどれか。", o:["26%","30%","24%","36%"], a:0, e:"定価は原価の1.4倍。それを1割引で売るので1.4×0.9＝1.26倍。利益率は26%。", t:"割引と割増は掛け合わせる。足し引きしないよう注意。", lv:2 },
 { id:"suri-025", cat:"数理", sub:"損益算", q:"仕入れ値の3割の利益を見込み定価をつけたが、定価の200円引きで売ったら利益は仕入れ値の1割になった。仕入れ値はいくらか。", o:["800円","1,000円","1,200円","2,000円"], a:1, e:"仕入れ値をxとすると売価は1.3x−200。利益は0.1xなので1.3x−200−x＝0.1x、x＝1,000円。", lv:3 },
 { id:"suri-026", cat:"数理", sub:"損益算", q:"商品AとBを合わせて7,000円で仕入れ、Aは2割・Bは3割の利益を見込み定価をつけたら、定価の合計は9,000円だった。Aの仕入れ値はいくらか。", o:["2,000円","3,000円","4,000円","1,000円"], a:3, e:"Aをxとすると1.2x+1.3(7,000−x)＝9,000。解くとx＝1,000円。", t:"連立せず1文字で表すのがコツ。", lv:3 },
 { id:"suri-027", cat:"数理", sub:"損益算", q:"ある商品を定価の15%引きで売ると、原価に対して2%の利益になる。定価は原価の何倍か。", o:["1.2倍","1.17倍","1.15倍","1.25倍"], a:0, e:"定価×0.85＝原価×1.02より、定価＝原価×(1.02÷0.85)＝原価×1.2。", lv:2 },
 { id:"suri-028", cat:"数理", sub:"速さ・距離・時間", q:"時速72kmは秒速何mか。", o:["12m/s","20m/s","200m/s","7.2m/s"], a:1, e:"72×1000÷3600＝20m/s。", t:"km/hをm/sに直すには÷3.6が速い。", lv:1 },
 { id:"suri-029", cat:"数理", sub:"速さ・距離・時間", q:"18kmの道のりを時速6kmで歩くと何時間かかるか。", o:["2時間","4時間","2.5時間","3時間"], a:3, e:"時間＝距離÷速さ＝18÷6＝3時間。", lv:1 },
 { id:"suri-030", cat:"数理", sub:"速さ・距離・時間", q:"A地点からB地点まで、行きは時速4km、帰りは時速6kmで往復すると合計5時間かかった。A-B間の距離は何kmか。", o:["12km","10km","15km","20km"], a:0, e:"距離をdとするとd/4+d/6＝5。整理して5d/12＝5、d＝12km。", t:"往復の速さの問題は「距離の式」を分数のまま連立させる。", lv:2 },
 { id:"suri-031", cat:"数理", sub:"速さ・距離・時間", q:"長さ150mの列車が秒速25mで長さ600mの鉄橋を渡り始めてから渡り終えるまで何秒かかるか。", o:["24秒","30秒","26秒","36秒"], a:1, e:"通過距離は鉄橋600m＋列車150m＝750m。750÷25＝30秒。", t:"通過距離は「橋の長さ＋列車の長さ」。列車の長さを忘れやすい。", lv:2 },
 { id:"suri-032", cat:"数理", sub:"速さ・距離・時間", q:"A君は分速80mで歩き、10分後にB君が同じ地点から分速120mで追いかけた。B君が出発してから何分後に追いつくか。", o:["15分","25分","20分","10分"], a:2, e:"出発時点でA君は800m先。差は毎分40mずつ縮むので800÷40＝20分で追いつく。", t:"追いつき算は「先行距離÷速さの差」。", lv:3 },
 { id:"suri-033", cat:"数理", sub:"速さ・距離・時間", q:"池の周りをAとBが反対方向に同時出発すると12分で出会い、同じ方向なら60分でAがBに1周差をつける。速さの比A:Bはどれか。", o:["2:1","5:3","4:3","3:2"], a:3, e:"周の長さをLとすると(a+b)×12＝(a−b)×60。整理するとa:b＝3:2。", t:"出会い算は速さの和、追いつき算は速さの差を使う。", lv:3 },
 { id:"suri-034", cat:"数理", sub:"速さ・距離・時間", q:"静水での速さが時速20kmの船が、川を32km上るのに2時間かかった。この川の流れの速さは時速何kmか。", o:["4km/h","6km/h","8km/h","10km/h"], a:0, e:"上りの実際の速さは32÷2＝16km/h。静水速さとの差が流速なので20−16＝4km/h。", t:"上り＝静水−流速、下り＝静水+流速。", lv:3 },
 { id:"suri-035", cat:"数理", sub:"濃度算", q:"食塩水300gに食塩45gが溶けている。この食塩水の濃度は何%か。", o:["10%","15%","20%","25%"], a:1, e:"濃度＝食塩の量÷食塩水全体×100＝45÷300×100＝15%。", lv:1 },
 { id:"suri-036", cat:"数理", sub:"濃度算", q:"濃度10%の食塩水150gと濃度4%の食塩水350gを混ぜると濃度は何%になるか。", o:["7%","6.5%","10%","5.8%"], a:3, e:"食塩の合計は150×0.1+350×0.04＝29g。全体500gなので29÷500×100＝5.8%。", lv:2 },
 { id:"suri-037", cat:"数理", sub:"濃度算", q:"12%の食塩水250gから水を蒸発させて濃度を20%にしたい。蒸発させる水は何gか。", o:["100g","120g","80g","150g"], a:0, e:"食塩30gは変わらない。20%になる全体量は30÷0.2＝150g。蒸発量は250−150＝100g。", t:"蒸発は水だけ減る。食塩の量は変わらない点は加水と同じ。", lv:2 },
 { id:"suri-038", cat:"数理", sub:"濃度算", q:"濃度不明の食塩水400gに濃度5%の食塩水100gを混ぜたら濃度10%になった。もとの食塩水の濃度は何%か。", o:["12.5%","11.25%","10.5%","13.75%"], a:1, e:"混合後の食塩は500×0.10＝50g。加えた食塩は100×0.05＝5gなので、もとの食塩は45g。45÷400×100＝11.25%。", lv:2 },
 { id:"suri-039", cat:"数理", sub:"濃度算", q:"濃度8%と濃度20%の食塩水を混ぜて濃度14%の食塩水を300g作りたい。8%の食塩水は何g必要か。", o:["100g","180g","200g","150g"], a:3, e:"8%をxgとすると0.08x+0.2(300−x)＝42を解いてx＝150g。", t:"食塩水の混合は「食塩の量」で方程式を立てる。", lv:3 },
 { id:"suri-040", cat:"数理", sub:"仕事算", q:"ある仕事をAは9日、Bは18日で終える。2人で同時に行うと何日で終わるか。", o:["6日","7日","9日","12日"], a:0, e:"1日あたりA＝1/9、B＝1/18、合計1/6。1÷(1/6)＝6日。", lv:1 },
 { id:"suri-041", cat:"数理", sub:"仕事算", q:"Aが1人で行うと15日、AとBの2人で行うと6日で終わる仕事がある。Bが1人で行うと何日かかるか。", o:["9日","10日","12日","20日"], a:1, e:"1/B＝1/6−1/15＝3/30＝1/10なのでB＝10日。", lv:2 },
 { id:"suri-042", cat:"数理", sub:"仕事算", q:"AとBの2本の管で水槽を満水にすると4分かかる。Aだけだと12分かかるとき、Bだけだと何分かかるか。", o:["8分","3分","6分","16分"], a:2, e:"1/B＝1/4−1/12＝2/12＝1/6なのでB＝6分。", t:"「同時に使うと◯分」から先に合計仕事率を出す。", lv:2 },
 { id:"suri-043", cat:"数理", sub:"仕事算", q:"ある仕事をAは6日、Bは3日、Cは6日で終える。3人が同時に行うと何日で終わるか。", o:["1日","2日","3日","1.5日"], a:3, e:"1日あたりの仕事量は1/6+1/3+1/6＝2/3。1÷(2/3)＝1.5日。", lv:2 },
 { id:"suri-044", cat:"数理", sub:"仕事算", q:"Aが1人で行うと15日かかる仕事を、Aが5日働いた後、残りをAとBの2人で行うと4日で終わった。Bが1人で行うと何日かかるか。", o:["10日","12日","20日","9日"], a:0, e:"Aは5日で全体の5/15＝1/3を終える。残り2/3を4日で行うので(1/15+1/B)×4＝2/3、1/B＝1/10、B＝10日。", t:"全体を1とおき、済んだ分と残りに分けて考える。", lv:3 },
 { id:"suri-045", cat:"数理", sub:"平均・過不足", q:"4回のテストの平均点は68点だった。合計点は何点か。", o:["260点","272点","280点","264点"], a:1, e:"平均×回数＝合計。68×4＝272点。", lv:1 },
 { id:"suri-046", cat:"数理", sub:"平均・過不足", q:"みかんを1人5個ずつ配ると8個余り、1人7個ずつ配ると10個不足する。子どもの人数は何人か。", o:["7人","8人","10人","9人"], a:3, e:"(8+10)÷(7−5)＝18÷2＝9人。", t:"過不足算は「差の合計÷1人あたりの差」。", lv:2 },
 { id:"suri-047", cat:"数理", sub:"平均・過不足", q:"A、B、C、Dの4人の体重の平均は58kgである。Eが加わり5人の平均が60kgになった。Eの体重は何kgか。", o:["68kg","60kg","64kg","70kg"], a:0, e:"4人の合計は58×4＝232kg。5人の合計は60×5＝300kg。E＝300−232＝68kg。", lv:2 },
 { id:"suri-048", cat:"数理", sub:"平均・過不足", q:"男子15人、女子10人のクラスで、男子の平均点は72点、女子は78点だった。クラス全体の平均点は何点か。", o:["75点","74.4点","76.2点","73.8点"], a:1, e:"合計点は15×72+10×78＝1,860点。人数25人で割ると74.4点。", t:"人数が違う集団の平均は、単純平均ではなく合計から求める。", lv:3 },
 { id:"suri-049", cat:"数理", sub:"平均・過不足", q:"旅行代金を1人3,000円ずつ集めると2,000円不足し、1人3,200円ずつ集めると4,000円余る。参加者は何人か。", o:["25人","28人","20人","30人"], a:3, e:"(2,000+4,000)÷(3,200−3,000)＝6,000÷200＝30人。", lv:2 },
 { id:"suri-050", cat:"数理", sub:"平均・過不足", q:"5人の得点の平均は64点で、最高点の生徒を除いた4人の平均は60点だった。最高点の生徒の得点は何点か。", o:["70点","76点","80点","84点"], a:2, e:"5人合計は64×5＝320点。最高点を除く4人合計は60×4＝240点。最高点＝320−240＝80点。", lv:3 },
// ===== 場合の数 (7) =====
 { id:"suri-051", cat:"数理", sub:"場合の数", q:"5人の中から議長1名、副議長1名を選ぶ。選び方は何通りか。", o:["20通り","10通り","25通り","60通り"], a:0, e:"議長の選び方は5通り、副議長は残り4人から4通り。5×4＝20通り。", lv:1 },
 { id:"suri-052", cat:"数理", sub:"場合の数", q:"8人から4人の委員を選ぶ。選び方は何通りか。", o:["56通り","70通り","35通り","28通り"], a:1, e:"順序を考えない選び方は組み合わせ。8C4＝(8×7×6×5)÷(4×3×2×1)＝70通り。", t:"「選ぶだけ」なら組み合わせ、「並べる」なら順列。混同注意。", lv:2 },
 { id:"suri-053", cat:"数理", sub:"場合の数", q:"6人が円卓に座る。回転して同じ配置は1通りとすると座り方は何通りか。", o:["720通り","360通り","120通り","30通り"], a:2, e:"円順列は(人数−1)!。(6−1)!＝5!＝120通り。", t:"円順列は1人を固定し、残りを並べると考えるとよい。", lv:2 },
 { id:"suri-054", cat:"数理", sub:"場合の数", q:"0,1,2,3,4の5枚から3枚を選び3桁の整数を作る。先頭は0不可として何通りか。", o:["60通り","36通り","24通り","48通り"], a:3, e:"百の位は0を除く4通り、残り2桁は使った数字を除く4枚から4×3通り。4×4×3＝48通り。", t:"先頭に0が使えない条件を数え忘れる誤りが多い。", lv:3 },
 { id:"suri-055", cat:"数理", sub:"場合の数", q:"A地点からB地点まで東に3区画、北に2区画進む。東か北にしか進めないとき最短経路は何通りか。", o:["10通り","6通り","20通り","5通り"], a:0, e:"5回の移動のうちどの2回を「北」にするか選べばよい。5C2＝10通り。", lv:3 },
 { id:"suri-056", cat:"数理", sub:"場合の数", q:"赤玉3個、白玉2個を1列に並べる。同色は区別しないとき並べ方は何通りか。", o:["20通り","10通り","60通り","120通り"], a:1, e:"5個の並べ方5!のうち同色の入れ替えは区別しないので3!と2!で割る。5!÷(3!×2!)＝10通り。", lv:2 },
 { id:"suri-057", cat:"数理", sub:"場合の数", q:"1〜5の5枚から異なる3枚を選び3桁の整数を作る。偶数は何通りできるか。", o:["60通り","36通り","24通り","12通り"], a:2, e:"一の位は2か4の2通り。残り2桁は残る4枚から4×3＝12通り。2×12＝24通り。", t:"偶数・奇数の条件は一の位から先に決めると整理しやすい。", lv:2 },

 // ===== 確率 (7) =====
 { id:"suri-058", cat:"数理", sub:"確率", q:"サイコロを2回投げるとき、少なくとも1回6の目が出る確率はどれか。", o:["1/3","25/36","1/6","11/36"], a:3, e:"一度も6が出ない確率は(5/6)²＝25/36。余事象で1−25/36＝11/36。", t:"「少なくとも1回」は余事象から求めるのが定石。", lv:2 },
 { id:"suri-059", cat:"数理", sub:"確率", q:"赤玉4個、白玉6個が入った袋から1個取り出す。赤玉である確率はどれか。", o:["2/5","3/5","1/2","3/10"], a:0, e:"全体10個のうち赤玉は4個。4/10を約分して2/5。", lv:1 },
 { id:"suri-060", cat:"数理", sub:"確率", q:"赤玉3個、白玉2個の袋から玉を1個取り出し、戻さずもう1個取り出す。2個とも赤玉の確率はどれか。", o:["6/25","3/10","3/5","1/2"], a:1, e:"1個目が赤の確率は3/5。残り4個中赤2個なので2個目は2/4。3/5×2/4＝3/10。", t:"「戻さない」問題は2回目の分母も1つ減らす。", lv:3 },
 { id:"suri-061", cat:"数理", sub:"確率", q:"硬貨を3回投げるとき、ちょうど2回表が出る確率はどれか。", o:["1/4","1/2","3/8","3/4"], a:2, e:"表2回裏1回の出方は3通り。各出方の確率は(1/2)³＝1/8なので3×1/8＝3/8。", lv:2 },
 { id:"suri-062", cat:"数理", sub:"確率", q:"1〜10の数字が1枚ずつ書かれた10枚のカードから1枚引く。3の倍数である確率はどれか。", o:["1/3","2/5","1/2","3/10"], a:3, e:"3の倍数は3,6,9の3枚。10枚中3枚なので3/10。", lv:1 },
 { id:"suri-063", cat:"数理", sub:"確率", q:"2つのサイコロを同時に投げ、出た目の積が12になる確率はどれか。", o:["1/9","1/12","1/6","1/18"], a:0, e:"積が12になる組は(2,6)(6,2)(3,4)(4,3)の4通り。全36通りなので4/36＝1/9。", t:"積の問題は組を書き出し、数え漏れに注意する。", lv:3 },
 { id:"suri-064", cat:"数理", sub:"確率", q:"10本中3本が当たりのくじから同時に2本引く。少なくとも1本当たる確率はどれか。", o:["7/15","8/15","1/3","3/5"], a:1, e:"2本ともはずれる確率は7C2/10C2＝21/45＝7/15。余事象で1−7/15＝8/15。", t:"「少なくとも」はまず「1本も当たらない」場合から攻める。", lv:3 },

 // ===== 数列 (7) =====
 { id:"suri-065", cat:"数理", sub:"数列", q:"次の数列の第20項はいくつか。", s:"3, 7, 11, 15, ...", o:["83","75","79","80"], a:2, e:"公差4の等差数列。第20項＝初項3＋4×(20−1)＝3+76＝79。", lv:2 },
 { id:"suri-066", cat:"数理", sub:"数列", q:"次の数列の第6項はいくつか。", s:"2, 6, 18, 54, ...", o:["162","1458","243","486"], a:3, e:"公比3の等比数列。第6項＝2×3⁵＝2×243＝486。", t:"等比数列は「初項×公比^(項数−1)」で求める。", lv:2 },
 { id:"suri-067", cat:"数理", sub:"数列", q:"次の数列の□に入る数はどれか。", s:"1, 2, 4, 7, 11, □", o:["16","15","17","18"], a:0, e:"隣り合う項の差が1,2,3,4と1ずつ増えている。次の差は5なので11+5＝16。", lv:2 },
 { id:"suri-068", cat:"数理", sub:"数列", q:"次の数列の□に入る数はどれか。", s:"1, 3, 6, 10, 15, □", o:["20","21","22","25"], a:1, e:"差が2,3,4,5と1ずつ増える数列。次の差は6なので15+6＝21。", lv:2 },
 { id:"suri-069", cat:"数理", sub:"数列", q:"1から50までの整数をすべて足すといくつになるか。", o:["1225","1250","1275","1300"], a:2, e:"1からnまでの和はn(n+1)÷2。50×51÷2＝1275。", t:"連続する整数の和はガウスの公式で一気に求める。", lv:2 },
 { id:"suri-070", cat:"数理", sub:"数列", q:"次の数列の第7項はいくつか。", s:"3, 9, 27, 81, ...", o:["729","6561","2178","2187"], a:3, e:"公比3の等比数列で第n項は3ⁿ。第7項は3⁷＝2187。", lv:2 },
 { id:"suri-071", cat:"数理", sub:"数列", q:"次の数列の□に入る数はどれか。", s:"100, 95, 89, 82, 74, □", o:["65","66","64","67"], a:0, e:"差が−5,−6,−7,−8と1ずつ大きくなっている。次の差は−9なので74−9＝65。", lv:3 },

 // ===== 方程式・文章題 (7) =====
 { id:"suri-072", cat:"数理", sub:"方程式・文章題", q:"連続する3つの整数の和が72である。最大の数はいくつか。", o:["24","25","23","26"], a:1, e:"中央の数をxとすると(x−1)+x+(x+1)＝3x＝72よりx＝24。最大は25。", lv:1 },
 { id:"suri-073", cat:"数理", sub:"方程式・文章題", q:"ある数の3倍から7を引くと20になる。ある数はいくつか。", o:["8","10","9","11"], a:2, e:"ある数をxとすると3x−7＝20。3x＝27よりx＝9。", lv:1 },
 { id:"suri-074", cat:"数理", sub:"方程式・文章題", q:"大小2つの数があり、和は50、差は12である。大きい方の数はいくつか。", o:["38","25","19","31"], a:3, e:"大きい数x、小さい数yとしx+y＝50、x−y＝12。2式を足すと2x＝62、x＝31。", t:"和差算は「足して2で割る」「引いて2で割る」で処理する。", lv:2 },
 { id:"suri-075", cat:"数理", sub:"方程式・文章題", q:"りんご1個120円、みかん1個150円を合わせて8個買い、代金1,020円だった。りんごは何個か。", o:["6個","5個","4個","7個"], a:0, e:"りんごの数をaとすると120a+150(8−a)＝1020。整理すると−30a＝−180、a＝6。", lv:2 },
 { id:"suri-076", cat:"数理", sub:"方程式・文章題", q:"ノート1冊とペン1本で350円。ノート3冊とペン2本で950円。ペン1本はいくらか。", o:["75円","100円","125円","150円"], a:1, e:"ノートn円、ペンp円とするとn+p＝350、3n+2p＝950。前式を3倍し3n+3p＝1050。これから3n+2p＝950を引くとp＝100円。", t:"連立方程式は片方を何倍かして文字を1つ消すのが基本。", lv:3 },
 { id:"suri-077", cat:"数理", sub:"方程式・文章題", q:"兄は弟の3倍の金額を持つ。兄が弟に600円渡すと所持金が等しくなる。弟の最初の所持金はいくらか。", o:["900円","300円","600円","1200円"], a:2, e:"弟の所持金をxとすると兄は3x。渡した後3x−600＝x+600より2x＝1200、x＝600円。", t:"やり取り算は「渡す前」「渡した後」の式を分けて立てる。", lv:2 },

function isPlainObject(v){ return !!v && typeof v==='object' && !Array.isArray(v); }

function defaultSettings(){
  return { limitSec:30, timerOn:true, shuffleOpts:true, instantExp:true, theme:'dark', fontSize:'m' };
}
function defaultState(){
  return {
    v:1, stats:{}, history:[], days:{}, resume:null, settings:defaultSettings(),
    lastExportAt:null, exportSnoozeUntil:null, hideAddToHome:false
  };
}
function safeGetItem(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function safeSetItem(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function safeRemoveItem(k){ try{ localStorage.removeItem(k); }catch(e){} }

function loadState(){
  var raw = safeGetItem(LS_KEY);
  if(!raw) return defaultState();
  var parsed;
  try{ parsed = JSON.parse(raw); }
  catch(e){
    safeSetItem(LS_BROKEN_KEY, raw);
    safeRemoveItem(LS_KEY);
    return defaultState();
  }
  if(!isPlainObject(parsed)){
    safeSetItem(LS_BROKEN_KEY, raw);
    return defaultState();
  }
  return {
    v:1,
    stats: isPlainObject(parsed.stats)?parsed.stats:{},
    history: Array.isArray(parsed.history)?parsed.history:[],
    days: isPlainObject(parsed.days)?parsed.days:{},
    resume: isPlainObject(parsed.resume)?parsed.resume:null,
    settings: Object.assign(defaultSettings(), isPlainObject(parsed.settings)?parsed.settings:{}),
    lastExportAt: (typeof parsed.lastExportAt==='number')?parsed.lastExportAt:null,
    exportSnoozeUntil: (typeof parsed.exportSnoozeUntil==='number')?parsed.exportSnoozeUntil:null,
    hideAddToHome: !!parsed.hideAddToHome
  };
}

function persistState(){
  var json;
  try{ json = JSON.stringify(S); }catch(e){ return; }
  if(safeSetItem(LS_KEY, json)) return;
  try{
    if(S.history.length>1){
      S.history = S.history.slice(Math.ceil(S.history.length/2));
      var json2 = JSON.stringify(S);
      if(safeSetItem(LS_KEY, json2)) return;
    }
  }catch(e){ /* 諦めてメモリ上のみで継続 */ }
}

function fmtDate(d){
  var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
function todayKey(){ return fmtDate(new Date()); }

function computeStreak(){
  var d = new Date();
  var tk = fmtDate(d);
  if(!(S.days[tk] && S.days[tk].n>0)){ d.setDate(d.getDate()-1); }
  var streak=0;
  while(true){
    var k=fmtDate(d);
    if(S.days[k] && S.days[k].n>0){ streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  return streak;
}

function shuffleArray(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}

function priorityScore(q, now, weakSet){
  var st = S.stats[q.id];
  var weak = (weakSet && weakSet.has(subKey(q.cat,q.sub))) ? 1 : 0;
  var tier, val;
  if(!st || !st.seen){ tier=2; val=0; }
  else if(st.due && st.due<=now){ tier=3; val=now-st.due; }
  else { tier=1; val=-(st.box||1); }
  return [weak, tier, val, Math.random()];
}
function sortByPriority(list, weakSet){
  var now=Date.now();
  return list.map(function(q){ return {q:q,k:priorityScore(q,now,weakSet)}; })
    .sort(function(x,y){
      for(var i=0;i<x.k.length;i++){ if(x.k[i]!==y.k[i]) return y.k[i]-x.k[i]; }
      return 0;
    })
    .map(function(x){ return x.q; });
}
function pickN(list, n, weakSet){
  var sorted = sortByPriority(list, weakSet);
  return n>0 ? sorted.slice(0,n) : sorted;
}
function byCat(cat){ return Q_ALL.filter(function(q){ return q.cat===cat; }); }
function buildRatioQueue(mix){
  var out=[];
  Object.keys(mix).forEach(function(cat){
    var pool = byCat(cat);
    var picked = pickN(pool, mix[cat], null);
    out = out.concat(picked);
  });
  return shuffleArray(out);
}

// sub（小分野）名は複数の cat（尺度）間で重複しうる（例：「長文読解」は言語にも英語にもある）。
// そのため sub 単体ではなく cat+sub の複合キーで集計・識別する。
function subKey(cat, sub){ return cat + "::" + sub; }
function computeSubAgg(){
  var agg={};
  Q_ALL.forEach(function(q){
    var k=subKey(q.cat,q.sub);
    if(!agg[k]) agg[k]={cat:q.cat, sub:q.sub, n:0, ok:0, sumMs:0};
  });
  S.history.forEach(function(h){
    var k=subKey(h.cat,h.sub);
    var a = agg[k] || (agg[k]={cat:h.cat, sub:h.sub, n:0, ok:0, sumMs:0});
    a.n++; if(h.ok) a.ok++; a.sumMs+=h.ms;
  });
  return agg;
}
function computeWeakSubs(){
  var agg = computeSubAgg();
  var limitMs = (S.settings.timerOn && S.settings.limitSec) ? S.settings.limitSec*1000 : null;
  var weak = new Set();
  Object.keys(agg).forEach(function(k){
    var a=agg[k];
    if(a.n>=3){
      var rate = a.ok/a.n;
      var avg = a.sumMs/a.n;
      var slow = limitMs!=null && avg > limitMs*0.8;
      if(rate<0.6 || slow) weak.add(subKey(a.cat,a.sub));
    }
  });
  return weak;
}

function recordAnswer(q, ok, ms){
  var now = Date.now();
  var cur = S.stats[q.id] || {seen:0, ok:0, ng:0, box:1, due:0, lastAt:0, lastMs:0, flag:false};
  cur.seen++;
  if(ok){ cur.ok++; cur.box = Math.min(5,(cur.box||1)+1); }
  else { cur.ng++; cur.box = 1; }
  cur.lastAt = now;
  cur.lastMs = ms;
  cur.due = now + INTERVAL_DAYS[cur.box-1]*86400000;
  S.stats[q.id]=cur;

  S.history.push({id:q.id, cat:q.cat, sub:q.sub, ok:ok, ms:ms, at:now});
  if(S.history.length>HISTORY_MAX){ S.history = S.history.slice(S.history.length-HISTORY_MAX); }

  var tk=todayKey();
  var day = S.days[tk] || {n:0, ok:0};
  day.n++; if(ok) day.ok++;
  S.days[tk]=day;
}

  hint.classList.toggle('show', hasMore);

function stopQuestionTimer(){ if(qTimerHandle){ clearInterval(qTimerHandle); qTimerHandle=null; } }
function startQuestionTimer(){
  stopQuestionTimer();
  qStartAt = Date.now();
  qAnswered = false;
  if(!S.settings.timerOn){
    $('#timerBar').hidden=true; $('#overMsg').hidden=true; $('#hudClock').textContent=''; $('#hudClock').classList.remove('over');
    return;
  }
  tickQuestionTimer();
  qTimerHandle = setInterval(tickQuestionTimer, 200);
}
function tickQuestionTimer(){
  if(!S.settings.timerOn) return;
  var limitSec = S.settings.limitSec;
  var elapsed = Date.now()-qStartAt;
  var hudClock=$('#hudClock'), bar=$('#timerFill'), barWrap=$('#timerBar'), overMsg=$('#overMsg');
  if(!limitSec){
    hudClock.textContent = (elapsed/1000).toFixed(1)+'s';
    hudClock.classList.remove('over');
    barWrap.hidden=true; overMsg.hidden=true;
    return;
  }
  barWrap.hidden=false;
  var limitMs = limitSec*1000;
  if(elapsed<=limitMs){
    var left=(limitMs-elapsed)/1000;
    hudClock.textContent = left.toFixed(1)+'s';
    hudClock.classList.remove('over');
    barWrap.classList.remove('over');
    barFillSet(bar, elapsed/limitMs);
    overMsg.hidden=true;
  } else {
    var over=(elapsed-limitMs)/1000;
    hudClock.textContent = '+'+over.toFixed(1)+'s';
    hudClock.classList.add('over');
    barFillSet(bar,1);
    barWrap.classList.add('over');
    overMsg.hidden=false;
    overMsg.textContent = over.toFixed(1)+'秒超過　学習優先のため自動では進みません';
  }
}

function stopOverallTimer(){ if(overallHandle){ clearInterval(overallHandle); overallHandle=null; } }
function startOverallTimer(){
  stopOverallTimer();
  if(!S.resume || !S.resume.overallEndAt){ $('#hudOverall').hidden=true; return; }
  $('#hudOverall').hidden=false;
  tickOverall();
  overallHandle = setInterval(tickOverall, 500);
}
function tickOverall(){
  if(!S.resume || !S.resume.overallEndAt) return;
  var left = S.resume.overallEndAt - Date.now();
  var el = $('#hudOverall');
  if(left<=0){
    el.textContent = '全体時間終了';
    stopOverallTimer();
    finishSession();
    return;
  }
  var m = Math.floor(left/60000), s=Math.floor((left%60000)/1000);
  el.textContent = '全体残り '+m+':'+String(s).padStart(2,'0');
}

    var wrap=document.createElement('div'); wrap.className='tblscroll';
    var table=document.createElement('table');
    var thead=document.createElement('thead'); var trh=document.createElement('tr');
    q.tbl.head.forEach(function(h){ var th=document.createElement('th'); th.textContent=h; trh.appendChild(th); });
    thead.appendChild(trh); table.appendChild(thead);
    var tbody=document.createElement('tbody');
    q.tbl.rows.forEach(function(row){
      var tr=document.createElement('tr');
      row.forEach(function(c){ var td=document.createElement('td'); td.textContent=c; tr.appendChild(td); });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody); wrap.appendChild(table); qTbl.appendChild(wrap);
  } else { qTbl.hidden=true; }

  var order = q.o.map(function(_,i){ return i; });
  if(S.settings.shuffleOpts) order = shuffleArray(order);
  currentOptMap = order;

  var optsEl=$('#opts'); optsEl.innerHTML='';
  var LETTERS=['A','B','C','D'];
  order.forEach(function(origIdx, pos){
    var b=document.createElement('button');
    b.type='button'; b.className='opt-btn';
    var mk=document.createElement('span'); mk.className='opt-mk'; mk.textContent=LETTERS[pos];
    var tx=document.createElement('span'); tx.className='opt-tx'; tx.textContent=q.o[origIdx];
    b.appendChild(mk); b.appendChild(tx);
    b.addEventListener('click', function(){ answerOption(origIdx, b); });
    optsEl.appendChild(b);
  });

  var st = S.stats[q.id];
  setFlagBtn(!!(st && st.flag));

  $('#feedback').hidden=true; $('#feedback').innerHTML='';
  var nextBtn=$('#nextBtn'); nextBtn.hidden=true; nextBtn.onclick=null;

  startQuestionTimer();
  if(S.resume.overallEndAt){ startOverallTimer(); } else { $('#hudOverall').hidden=true; stopOverallTimer(); }

  $('#quizScroll').scrollTop = 0;
  if(typeof requestAnimationFrame==='function'){ requestAnimationFrame(updateScrollHint); }
  else { updateScrollHint(); }
}

function renderExplanation(container){
  var e=document.createElement('p'); e.className='fb-e'; e.textContent=currentQ.e;
  container.appendChild(e);
  if(currentQ.t){
    var t=document.createElement('p'); t.className='fb-t'; t.textContent='ポイント: '+currentQ.t;
    container.appendChild(t);
  }
}

function renderFeedback(ok, ms){
  var fb=$('#feedback');
  fb.hidden=false; fb.innerHTML='';
  fb.className='feedback '+(ok?'ok':'ng');

  var verdict=document.createElement('div'); verdict.className='fb-verdict';
  var limitMs = S.settings.limitSec ? S.settings.limitSec*1000 : null;
  var overTxt = (limitMs && ms>limitMs) ? '（'+((ms-limitMs)/1000).toFixed(1)+'s 超過）' : '';
  var LETTERS=['A','B','C','D'];
  verdict.textContent = (ok?'正解':'不正解（正解: '+LETTERS[currentQ.a]+'）') + '　'+(ms/1000).toFixed(1)+'s'+overTxt;
  fb.appendChild(verdict);

  var expWrap=document.createElement('div'); expWrap.className='fb-exp';
  if(S.settings.instantExp){
    renderExplanation(expWrap);
  } else {
    var btn=document.createElement('button'); btn.type='button'; btn.className='btn btn-sm'; btn.textContent='解説を見る';
    btn.addEventListener('click', function(){ expWrap.innerHTML=''; renderExplanation(expWrap); });
    expWrap.appendChild(btn);
  }
  fb.appendChild(expWrap);

  var nextBtn=$('#nextBtn');
  nextBtn.hidden=false;
  nextBtn.textContent = (S.resume && S.resume.idx < S.resume.ids.length) ? '次へ' : '結果を見る';
  nextBtn.onclick = function(){ nextQuestion(); };
  nextBtn.focus();

  // 選択肢欄が伸びて問題領域の残り高さが変わるため再判定する
  if(typeof requestAnimationFrame==='function'){ requestAnimationFrame(updateScrollHint); }
  else { updateScrollHint(); }
}

function answerOption(origIdx, btnEl){
  if(!currentQ || qAnswered || !S.resume) return;
  qAnswered = true;
  stopQuestionTimer();
  var ms = Date.now()-qStartAt;
  var ok = origIdx===currentQ.a;

  var btns = $all('#opts .opt-btn');
  btns.forEach(function(b, pos){
    b.disabled = true;
    var oi = currentOptMap[pos];
    if(oi===currentQ.a) b.classList.add('correct');
    if(b===btnEl && !ok) b.classList.add('wrong');
  });

  recordAnswer(currentQ, ok, ms);
  S.resume.log.push({id:currentQ.id, cat:currentQ.cat, sub:currentQ.sub, ok:ok, ms:ms});
  S.resume.idx++;
  persistState();

  renderFeedback(ok, ms);
}

function nextQuestion(){
  if(!S.resume) return;
  if(S.resume.idx >= S.resume.ids.length){ finishSession(); return; }
  renderQuestion();
}

function finishSession(){
  stopQuestionTimer(); stopOverallTimer();
  var log = S.resume ? S.resume.log.slice() : [];
  var label = S.resume ? S.resume.label : '';
  lastResult = {label:label, log:log};
  S.resume = null;
  persistState();
  renderResult();
  showView('result');
}

var touchStartX=0, touchStartY=0, touchActive=false;
document.addEventListener('touchstart', function(e){
  if(currentView!=='quiz' || e.touches.length!==1) return;
  touchStartX=e.touches[0].clientX; touchStartY=e.touches[0].clientY; touchActive=true;
}, {passive:true});
document.addEventListener('touchend', function(e){
  if(!touchActive) return;
  touchActive=false;
  if(currentView!=='quiz' || !qAnswered) return;
  var t=e.changedTouches[0];
  var dx=t.clientX-touchStartX, dy=t.clientY-touchStartY;
  if(dx<=-50 && Math.abs(dy)<30){ nextQuestion(); }
}, {passive:true});

  if(S.exportSnoozeUntil && now < S.exportSnoozeUntil) return false;
  if(!S.lastExportAt) return true;
  return (now - S.lastExportAt) >= 14*86400000;

function renderResult(){
  var r = lastResult || {label:'', log:[]};
  var log = r.log;
  $('#resultLabel').textContent = r.label || '結果';
  var n=log.length, okN=log.filter(function(x){return x.ok;}).length;
  var pct = n ? Math.round(okN/n*100) : 0;
  $('#resultScore').textContent = okN+' / '+n+'　('+pct+'%)';

  var avg = n ? (log.reduce(function(s,x){return s+x.ms;},0)/n/1000) : 0;
  var limitMs = S.settings.limitSec ? S.settings.limitSec*1000 : null;
  var over = limitMs!=null ? log.filter(function(x){return x.ms>limitMs;}).length : null;
  $('#resultMeta').textContent = '平均解答時間 '+avg.toFixed(1)+'s' + (over!=null ? ('　／　'+S.settings.limitSec+'秒超過 '+over+'問') : '');

  var bySub={};
  log.forEach(function(x){
    var a = bySub[x.sub] || (bySub[x.sub]={cat:x.cat,n:0,ok:0});
    a.n++; if(x.ok) a.ok++;
  });
  var bd=$('#resultBreakdown'); bd.innerHTML='';
  Object.keys(bySub).sort().forEach(function(sub){
    var a=bySub[sub];
    var row=document.createElement('div'); row.className='bd-row';
    var l=document.createElement('span'); l.textContent=sub;
    var v=document.createElement('span'); v.textContent=a.ok+' / '+a.n;
    row.appendChild(l); row.appendChild(v);
    bd.appendChild(row);
  });

  var wrongIds = log.filter(function(x){return !x.ok;}).map(function(x){return x.id;});
  var retryBtn=$('#btnRetryWrong');
  retryBtn.hidden = wrongIds.length===0;
  retryBtn.onclick = function(){
    var ids = wrongIds.filter(function(id){ return QMAP.has(id); });
    if(!ids.length) return;
    startSession('retry','間違い直し', ids);
    showView('quiz'); renderQuestion();
  };
}

function startFieldSession(cat, sub){
  var candidates = Q_ALL.filter(function(q){ return q.cat===cat && q.sub===sub; });
  if(!candidates.length) return;
  var list = sortByPriority(candidates, null);
  startSession('field', '分野別：'+cat+'・'+sub, list.map(function(q){return q.id;}));

}
function renderFields(){
  var list=$('#fieldsList'); list.innerHTML='';
  var title=$('#fieldsTitle');
  var agg = computeSubAgg();
  var weak = computeWeakSubs();

  if(fieldsDrill===null){
    title.textContent='分野を選ぶ';
    CATS.forEach(function(cat){
      var subs = Object.keys(agg).map(function(k){return agg[k];}).filter(function(a){return a.cat===cat;});
      var n = subs.reduce(function(s,a){return s+a.n;},0);
      var okN = subs.reduce(function(s,a){return s+a.ok;},0);
      var pct = n ? Math.round(okN/n*100) : null;
      var count = Q_ALL.filter(function(q){return q.cat===cat;}).length;
      var row=document.createElement('button'); row.type='button'; row.className='field-row';
      var t=document.createElement('span'); t.className='field-name'; t.textContent=cat;
      var m=document.createElement('span'); m.className='field-meta';
      m.textContent = count+'問'+(pct!=null?('　正答率'+pct+'%'):'　未着手');
      row.appendChild(t); row.appendChild(m);
      row.addEventListener('click', function(){ fieldsDrill=cat; renderFields(); });
      list.appendChild(row);
    });
  } else {
    var cat=fieldsDrill;
    title.textContent=cat;
    var subs = Object.keys(agg).map(function(k){return agg[k];}).filter(function(a){return a.cat===cat;})
      .sort(function(a,b){ return a.sub.localeCompare(b.sub,'ja'); });
    subs.forEach(function(a){
      var count = Q_ALL.filter(function(q){return q.cat===a.cat && q.sub===a.sub;}).length;
      var pct = a.n ? Math.round(a.ok/a.n*100) : null;
      var row=document.createElement('button'); row.type='button';
      row.className='field-row'+(weak.has(subKey(a.cat,a.sub))?' is-weak':(a.n===0?' is-untouched':''));
      var t=document.createElement('span'); t.className='field-name'; t.textContent=a.sub;
      var m=document.createElement('span'); m.className='field-meta';
      m.textContent = count+'問'+(pct!=null?('　正答率'+pct+'%'):'　未着手');
      row.appendChild(t); row.appendChild(m);
      row.addEventListener('click', function(){ startFieldSession(a.cat, a.sub); });
      list.appendChild(row);
    });
  }
}

function addKpi(container, label, val){
  var d=document.createElement('div'); d.className='kpi';
  var l=document.createElement('div'); l.className='kpi-label'; l.textContent=label;
  var v=document.createElement('div'); v.className='kpi-val'; v.textContent=val;
  d.appendChild(l); d.appendChild(v);
  container.appendChild(d);
}
function renderStats(){
  var total = S.history.length;
  var totalOk = S.history.filter(function(h){return h.ok;}).length;
  var totalPct = total ? Math.round(totalOk/total*100) : 0;
  var streak = computeStreak();
  var kpiRow=$('#kpiRow'); kpiRow.innerHTML='';
  addKpi(kpiRow, '通算解答数', total+'問');
  addKpi(kpiRow, '通算正答率', totalPct+'%');
  addKpi(kpiRow, '連続学習日数', streak+'日');

  var dayBars=$('#dayBars'); dayBars.innerHTML='';
  var days=[];
  for(var i=13;i>=0;i--){
    var d=new Date(); d.setDate(d.getDate()-i);
    var k=fmtDate(d);
    days.push({k:k, n:(S.days[k]?S.days[k].n:0)});
  }
  var maxN = Math.max.apply(null, [1].concat(days.map(function(d){return d.n;})));
  days.forEach(function(d){
    var bar=document.createElement('div'); bar.className='daybar';
    var num=document.createElement('div'); num.className='daybar-n'; num.textContent = d.n||'';
    var fill=document.createElement('div'); fill.className='daybar-fill';
    fill.style.height = Math.max(2,Math.round(d.n/maxN*100))+'%';
    if(d.n===0) fill.style.height='2px';
    var lab=document.createElement('div'); lab.className='daybar-lab'; lab.textContent=d.k.slice(5).replace('-','/');
    bar.appendChild(num); bar.appendChild(fill); bar.appendChild(lab);
    dayBars.appendChild(bar);
  });

  var agg = computeSubAgg();
  var subList=$('#subList'); subList.innerHTML='';
  var rows = Object.keys(agg).map(function(k){
    var a=agg[k];
    return {cat:a.cat, sub:a.sub, n:a.n, ok:a.ok, pct: a.n ? a.ok/a.n : null};
  });
  rows.sort(function(a,b){
    if(a.pct==null && b.pct==null) return a.sub.localeCompare(b.sub,'ja');
    if(a.pct==null) return 1;
    if(b.pct==null) return -1;
    return a.pct-b.pct;
  });
  rows.forEach(function(a){
    var row=document.createElement('div');
    row.className='sub-row'+(a.pct==null?' is-untouched':(a.pct<0.6?' is-weak':''));
    var name=document.createElement('span'); name.textContent=a.cat+'・'+a.sub;
    var val=document.createElement('span');
    val.textContent = a.pct==null ? '未着手' : (Math.round(a.pct*100)+'%（'+a.n+'問）');
    row.appendChild(name); row.appendChild(val);
    subList.appendChild(row);
  });

  var h=S.history;
  var last50=h.slice(-50), prev50=h.slice(-100,-50);
  function avg(arr){ return arr.length ? (arr.reduce(function(s,x){return s+x.ms;},0)/arr.length/1000) : null; }
  var a1=avg(last50), a0=avg(prev50);
  var trendEl=$('#avgTrend');
  if(a1==null){ trendEl.textContent='データがまだありません。'; }
  else {
    var diffTxt='';
    if(a0!=null){
      var diff=a1-a0;
      diffTxt = '　（前の50問比 '+(diff<=0?'':'+')+diff.toFixed(1)+'s）';
    }
    trendEl.textContent = '直近'+last50.length+'問の平均 '+a1.toFixed(1)+'s'+diffTxt;
  }

  $('#exportArea').hidden=true; $('#exportBtns').hidden=true;
  $('#importBox').hidden=true; $('#importArea').value='';
}

  };
  persistState();
  applyTheme();
  renderStats();
  renderHome();
  alert('読み込みました。');
});
$('#btnResetData').addEventListener('click', function(){
  if(!window.confirm('学習履歴をすべて削除します。よろしいですか？（元に戻せません）')) return;
  var total = S.history.length;
  var agg = computeSubAgg();
  var subsWithData = Object.keys(agg).filter(function(k){ return agg[k].n>0; }).length;
  var streak = computeStreak();
  var msg = '本当にすべて消去しますか？\n通算'+total+'問の解答履歴、'+subsWithData+'分野の成績、連続学習'+streak+'日の記録がすべて失われます。\n書き出しをしていない場合、元に戻せません。';
  if(!window.confirm(msg)) return;
  S = defaultState();
  persistState();
  applyTheme();
  renderStats();
  renderHome();
  alert('学習履歴をリセットしました。');
});

/* ===================== 設定 ===================== */
function setSegValue(sel, val){
  $all(sel+' button').forEach(function(b){ b.classList.toggle('active', b.dataset.val===String(val)); });
}
function renderSettings(){
  setSegValue('#setLimitSec', S.settings.limitSec);
  $('#setTimerOn').checked = !!S.settings.timerOn;
  $('#setShuffleOpts').checked = !!S.settings.shuffleOpts;
  $('#setInstantExp').checked = !!S.settings.instantExp;
  setSegValue('#setFontSize', S.settings.fontSize);
  setSegValue('#setTheme', S.settings.theme);
}
$('#settingsBack').addEventListener('click', function(){ showView('home'); renderHome(); });
$all('.segmented').forEach(function(seg){
  seg.addEventListener('click', function(e){
    var btn = e.target.closest('button');
    if(!btn) return;
    var key = seg.dataset.key;
    var val = btn.dataset.val;
    if(key==='limitSec') val = Number(val);
    S.settings[key] = val;
    persistState();
    if(key==='theme' || key==='fontSize') applyTheme();
    renderSettings();
  });
});
$('#setTimerOn').addEventListener('change', function(e){ S.settings.timerOn=e.target.checked; persistState(); });
$('#setShuffleOpts').addEventListener('change', function(e){ S.settings.shuffleOpts=e.target.checked; persistState(); });
$('#setInstantExp').addEventListener('change', function(e){ S.settings.instantExp=e.target.checked; persistState(); });

/* ===================== 起動 ===================== */
applyTheme();
renderHome();
showView('home');

})();
</script>

<script>
(function(){
"use strict";
if(location.protocol === 'file:') return;
if(!('serviceWorker' in navigator)) return;

function showUpdateBanner(reg){
  try{
    if(document.getElementById('swUpdateBanner')) return;
    var bar = document.createElement('div');
    bar.id = 'swUpdateBanner';
    bar.setAttribute('role','status');
    bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9999;'+
      'display:flex;align-items:center;justify-content:space-between;gap:12px;'+
      'background:#173630;color:#E8EDE7;'+
      'font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;'+
      'font-size:13px;line-height:1.6;'+
      'padding:10px 14px calc(10px + env(safe-area-inset-bottom));'+
      'box-shadow:0 -2px 12px rgba(0,0,0,.25)';
    var txt = document.createElement('span');
    txt.textContent = '新しい版があります';
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = '再読み込み';
    btn.style.cssText = 'flex:none;min-height:36px;padding:6px 14px;border-radius:8px;'+
      'border:1px solid #E8EDE7;background:transparent;color:#E8EDE7;font-size:13px;cursor:pointer';
    btn.addEventListener('click', function(){
      try{ if(reg.waiting){ reg.waiting.postMessage('SKIP_WAITING'); } }catch(e){}
      bar.remove();
    });
    bar.appendChild(txt);
    bar.appendChild(btn);
    document.body.appendChild(bar);
  }catch(e){ /* no-op */ }
}

try{
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').then(function(reg){
      if(reg.waiting && navigator.serviceWorker.controller){ showUpdateBanner(reg); }
      reg.addEventListener('updatefound', function(){
        var nw = reg.installing;
        if(!nw) return;
        nw.addEventListener('statechange', function(){
          if(nw.state === 'installed' && navigator.serviceWorker.controller){
            showUpdateBanner(reg);
          }
        });
      });
    }).catch(function(){ /* SW登録に失敗してもアプリ本体は通常どおり動作する */ });

    var refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if(refreshing) return;
      refreshing = true;
      location.reload();
    });
  });
}catch(e){ /* no-op */ }
})();
</script>
